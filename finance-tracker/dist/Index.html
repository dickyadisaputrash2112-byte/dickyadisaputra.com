<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="theme-color" content="#0E1F4D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #0B1835;
  --ink-2: #1B2C55;
  --ink-3: #283B66;
  --navy: #0E1F4D;
  --navy-2: #2E55B0;
  --navy-3: #12296B;
  --ice: #C7E0FF;
  --bg-1: #AFC2E3;
  --bg-2: #8199C9;
  --bg-3: #5A74AA;
  --dk-1: #2E4FA8;
  --dk-2: #132B70;
  --dk-3: #0A1945;
  --orange: #F08A3C;
  --orange-ink: #1F1206;
  --green: #17643F;
  --red: #8E2A1E;
  --glass: rgba(255,255,255,0.34);
  --glass-strong: rgba(255,255,255,0.55);
  --glass-line: rgba(255,255,255,0.65);
  --dark-text-2: #D4DEF2;
  --dark-text-3: #B9C7E3;
  --cta: #F5F8FF;
  --cta-ink: var(--dk-3);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg-3);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.ic-s { width: 16px; height: 16px; }
.ic-l { width: 24px; height: 24px; }

/* ---------- Kerangka ---------- */
#app { min-height: 100vh; }
.frame { position: relative; max-width: 480px; min-height: 100vh; margin: 0 auto; overflow: hidden; }
.app-bg { background: linear-gradient(172deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%); }
.app-bg::before, .app-bg::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; }
.app-bg::before { left: -140px; top: -120px; width: 380px; height: 380px; background: rgba(255,255,255,0.42); filter: blur(70px); }
.app-bg::after { right: -160px; top: 520px; width: 360px; height: 360px; background: rgba(199,224,255,0.45); filter: blur(80px); }
.dark-bg { background: radial-gradient(130% 80% at 85% 0%, var(--dk-1) 0%, var(--dk-2) 45%, var(--dk-3) 100%); color: #fff; }
.page { position: relative; z-index: 1; padding: 20px 18px 120px; display: flex; flex-direction: column; gap: 14px; }
.page.no-nav { padding-bottom: 32px; }
.dark-page { position: relative; min-height: 100vh; padding: 24px 22px 26px; display: flex; flex-direction: column; }

/* ---------- Header ---------- */
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hdr h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.03em; text-align: center; flex: 1; }
.cbtn { width: 46px; height: 46px; border-radius: 99px; background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6); color: var(--navy); display: grid; place-items: center; flex-shrink: 0; text-decoration: none; position: relative; }
.cbtn.dark { background: var(--navy); color: var(--ice); border-color: var(--navy); }
.cbtn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 99px; background: var(--orange); border: 1.5px solid #E9EFFB; }
.avatar { width: 46px; height: 46px; border-radius: 99px; background: var(--navy); color: var(--ice); display: grid; place-items: center; font-weight: 800; font-size: 17px; border: 2px solid rgba(255,255,255,0.7); flex-shrink: 0; }
.spacer { width: 46px; flex-shrink: 0; }

/* ---------- Kartu kaca ---------- */
.glass { position: relative; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 30px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 14px 34px rgba(14,26,66,0.13); }
.pad { padding: 18px; }
.pad-s { padding: 12px 14px; }
.navy-card { background: radial-gradient(120% 120% at 100% 0%, var(--navy-2) 0%, var(--navy) 60%); color: #fff; border-radius: 30px; box-shadow: 0 18px 40px rgba(10,20,55,0.3); }
.tile { padding: 12px 14px; border-radius: 22px; background: var(--glass-strong); }
.tile small { display: block; font-size: 11px; font-weight: 600; color: var(--ink-3); }
.tile b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
.tile.navy { background: var(--navy); color: #fff; }
.tile.navy small { color: var(--dark-text-3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 0; }
.sec-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }
.link { font-size: 13px; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }

/* ---------- Tombol ---------- */
.btn { height: 56px; border-radius: 99px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 700; width: 100%; text-decoration: none; transition: transform .12s; }
.btn:active { transform: scale(.98); }
.btn-dark { background: var(--navy); color: #fff; box-shadow: 0 12px 28px rgba(10,20,55,0.3); }
.btn-glass { background: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.7); color: var(--ink); }
.btn-cta { height: 58px; border-radius: 18px; background: var(--cta); color: var(--cta-ink); box-shadow: 0 12px 28px rgba(0,0,0,0.3); }
.btn-text { height: 40px; font-size: 13px; font-weight: 700; color: var(--ink); width: auto; padding: 0 14px; align-self: center; }
.btn-danger { color: var(--red); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .bubble { width: 26px; height: 26px; border-radius: 99px; background: var(--ice); color: var(--navy); display: grid; place-items: center; }
.row-btns { display: flex; gap: 10px; }
.row-btns > * { flex: 1; }
.row-btns > .grow { flex: 1.5; }

/* ---------- Pil / chip ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.pill.navy { background: var(--navy); color: var(--ice); }
.pill.orange { background: var(--orange); color: var(--orange-ink); }
.pill.white { background: #fff; color: var(--ink); }
.pill.blue { background: #DCE5FF; color: #22408F; }
.seg { display: flex; gap: 6px; padding: 6px; border-radius: 99px; background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.6); }
.seg button { flex: 1; height: 42px; border-radius: 99px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.6); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.seg button.on { background: #fff; border-color: #fff; box-shadow: 0 4px 12px rgba(14,26,66,0.1); }
.seg .count { min-width: 20px; height: 20px; border-radius: 99px; background: var(--orange); color: var(--orange-ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 99px; background: rgba(255,255,255,0.38); border: 1px solid rgba(255,255,255,0.7); font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip.ic-chip { height: 46px; padding: 0 16px 0 6px; }
.chip .cic { width: 34px; height: 34px; border-radius: 99px; background: rgba(255,255,255,0.8); display: grid; place-items: center; }
.chip.on .cic { background: #fff; }

/* ---------- Baris transaksi ---------- */
.list { padding: 6px 14px; }
.trow { display: flex; align-items: center; gap: 12px; padding: 10px 2px; width: 100%; text-align: left; text-decoration: none; color: var(--ink); }
.trow + .trow { border-top: 1px solid rgba(255,255,255,0.55); }
.trow .ticon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 99px; background: #fff; display: grid; place-items: center; }
.trow .tmain { flex: 1; min-width: 0; }
.trow .ttitle { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .tmeta { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .tamt { text-align: right; flex-shrink: 0; }
.trow .tamt b { display: block; font-size: 15px; font-weight: 800; }
.trow .tamt small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.amt-in { color: var(--green); }
.amt-tr { color: var(--ink-3); }
.day-card { padding: 14px 14px 4px; }
.day-head { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 6px; }

/* ---------- Ring kategori ---------- */
.ring { border-radius: 99px; display: grid; place-items: center; flex-shrink: 0; }
.ring > span { border-radius: 99px; background: #fff; display: grid; place-items: center; }
.cat-row { display: flex; gap: 12px; overflow-x: auto; margin-right: -18px; padding: 2px 18px 6px 0; scrollbar-width: none; }
.cat-row::-webkit-scrollbar { display: none; }
.cat-card { flex-shrink: 0; width: 158px; padding: 16px; border-radius: 28px; }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cat-mini { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 26px; min-width: 0; }

/* ---------- Bilah ---------- */
.bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,0.6); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--navy); }
.bar.thin { height: 8px; }

/* ---------- Bottom nav ---------- */
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); width: min(452px, calc(100% - 28px)); height: 68px; padding: 7px; border-radius: 99px; background: var(--navy); box-shadow: 0 16px 34px rgba(8,18,50,0.35); display: flex; align-items: center; justify-content: space-between; z-index: 50; }
.nav .on { height: 54px; padding: 0 18px 0 14px; border-radius: 99px; background: #fff; color: var(--navy); display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
.nav .off { width: 48px; height: 48px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.06); color: #fff; display: grid; place-items: center; }
.nav .add { width: 50px; height: 50px; border-radius: 99px; background: var(--ice); color: var(--navy); display: grid; place-items: center; }

/* ---------- Gelap: onboarding ---------- */
.top-progress { display: flex; align-items: center; gap: 14px; min-height: 44px; }
.top-progress .count { font-size: 13px; font-weight: 700; color: var(--dark-text-2); }
.top-progress .segs { flex: 1; display: flex; gap: 5px; }
.top-progress .segs span { flex: 1; height: 4px; border-radius: 9px; background: rgba(255,255,255,0.18); }
.top-progress .segs span.on { background: var(--ice); }
.dbtn { width: 44px; height: 44px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.06); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.skip { font-size: 14px; font-weight: 700; color: #fff; }
.d-title { margin: 30px 0 0; font-size: 38px; line-height: 1.04; font-weight: 800; letter-spacing: -0.045em; }
.d-title span { color: var(--ice); }
.d-lede { margin: 14px 0 22px; font-size: 15px; line-height: 1.5; color: var(--dark-text-2); }
.d-label { font-size: 13px; font-weight: 700; color: var(--dark-text-2); display: block; margin-bottom: 8px; }
.d-input { width: 100%; height: 58px; padding: 0 20px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); font-size: 18px; font-weight: 700; color: #fff; outline: none; }
.d-input:focus { border-color: var(--ice); }
.d-input::placeholder { color: rgba(255,255,255,0.45); }
.d-card { padding: 16px; border-radius: 22px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); }
.d-note { display: flex; gap: 14px; align-items: flex-start; font-size: 13px; line-height: 1.55; color: var(--dark-text-2); }
.d-note b { color: #fff; }
.d-note .nic { width: 40px; height: 40px; border-radius: 99px; background: var(--ice); color: var(--navy); display: grid; place-items: center; flex-shrink: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 6px 0 14px; border-radius: 99px; background: rgba(199,224,255,0.16); color: #E3EEFF; font-size: 13px; font-weight: 700; }
.tag button { width: 24px; height: 24px; border-radius: 99px; background: rgba(255,255,255,0.12); color: #fff; display: grid; place-items: center; }
.tags input { flex: 1; min-width: 130px; height: 36px; border: 0; outline: none; background: transparent; font-size: 14px; font-weight: 600; color: #fff; padding: 0 6px; }
.tags input::placeholder { color: rgba(255,255,255,0.45); }
.src-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.src { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 10px; border-radius: 99px; color: #fff; text-align: left; border: 1.5px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); }
.src.on { border-color: var(--ice); background: rgba(199,224,255,0.14); }
.src .logo { width: 36px; height: 36px; border-radius: 99px; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.src .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.2; }
.src .md { display: block; font-size: 11px; font-weight: 600; color: var(--dark-text-3); margin-top: 2px; }
.src .ck { width: 22px; height: 22px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,0.3); display: grid; place-items: center; color: transparent; flex-shrink: 0; }
.src.on .ck { background: var(--ice); border-color: var(--ice); color: var(--navy); }
.switch { position: relative; width: 54px; height: 32px; flex-shrink: 0; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: rgba(255,255,255,0.3); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 99px; background: var(--navy); transition: transform .2s; }
.switch input:checked + i { background: #fff; }
.switch input:checked + i::after { transform: translateX(22px); }
.dark-bg .switch i { background: rgba(255,255,255,0.18); }
.dark-bg .switch i::after { background: #fff; }
.dark-bg .switch input:checked + i { background: var(--cta); }
.dark-bg .switch input:checked + i::after { background: var(--navy); }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px 14px 18px; border-radius: 99px; }
.toggle-row b { display: block; font-size: 15px; }
.toggle-row small { display: block; font-size: 12px; }

/* PIN */
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 34px 0 30px; }
.pin-dots span { width: 16px; height: 16px; border-radius: 99px; border: 2px solid rgba(255,255,255,0.35); }
.pin-dots span.on { background: var(--ice); border-color: var(--ice); }
.pin-dots.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; justify-items: center; max-width: 300px; margin: 0 auto; }
.key { width: 74px; height: 74px; border-radius: 99px; font-size: 26px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.16); }
.key.ghost { background: transparent; border-color: transparent; }

/* ---------- Ilustrasi intro ---------- */
.illus { position: relative; flex: 1; min-height: 300px; margin: 8px -22px 0; }
.illus .glow { position: absolute; left: 50%; top: 46%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; background: radial-gradient(circle, rgba(199,224,255,0.3), rgba(199,224,255,0) 65%); }
.illus .ped1 { position: absolute; left: 50%; bottom: 16px; width: 250px; height: 62px; margin-left: -125px; border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, var(--navy-2) 0%, var(--dk-3) 75%); box-shadow: 0 18px 30px rgba(0,0,0,0.45); }
.illus .ped2 { position: absolute; left: 50%; bottom: 40px; width: 250px; height: 46px; margin-left: -125px; border-radius: 50%; background: linear-gradient(180deg, var(--dk-1), var(--navy-3)); box-shadow: inset 0 2px 0 rgba(255,255,255,0.18); }
.receipt { position: absolute; left: 50%; top: 16px; width: 188px; margin-left: -94px; padding: 18px 18px 16px; border-radius: 22px; background: linear-gradient(165deg, #FFFFFF 0%, #E8EFFC 100%); color: var(--ink); transform: rotate(7deg); box-shadow: 0 24px 40px rgba(0,0,0,0.35); }
.envelope { position: absolute; left: 50%; top: 158px; width: 252px; height: 132px; margin-left: -126px; border-radius: 22px; background: linear-gradient(165deg, var(--navy-2) 0%, var(--navy-3) 100%); transform: rotate(-5deg); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.22), 0 20px 36px rgba(0,0,0,0.4); overflow: hidden; }
.float-pill { position: absolute; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 99px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); backdrop-filter: blur(14px); font-size: 12px; font-weight: 700; color: #fff; }
.orbit-logo { position: absolute; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; border: 2px solid rgba(255,255,255,0.35); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

/* ---------- Logo bank ---------- */
.blogo { position: relative; flex-shrink: 0; border-radius: 99px; background: #fff; display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 1px rgba(14,26,66,0.08); }
.blogo img { width: 74%; height: 74%; object-fit: contain; }
.blogo b { display: none; color: #fff; font-weight: 800; letter-spacing: .02em; }
.blogo.nofav { background: var(--c); }
.blogo.nofav img { display: none; }
.blogo.nofav b { display: block; }

/* ---------- Lain-lain ---------- */
.toast-wrap { position: fixed; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top)); width: min(420px, calc(100% - 32px)); z-index: 200; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px; background: var(--navy); color: #fff; font-size: 14px; font-weight: 700; box-shadow: 0 16px 40px rgba(0,0,0,0.3); pointer-events: auto; animation: tin .25s ease both; }
.toast .ic { color: var(--ice); }
.toast button { margin-left: auto; color: var(--ice); font-weight: 800; font-size: 13px; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.spin { width: 22px; height: 22px; border-radius: 99px; border: 2.5px solid rgba(14,31,77,0.2); border-top-color: var(--navy); animation: rot .8s linear infinite; }
.dark-bg .spin { border-color: rgba(255,255,255,0.2); border-top-color: var(--ice); }
@keyframes rot { to { transform: rotate(360deg); } }
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 0; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.empty { text-align: center; padding: 34px 18px; font-size: 14px; color: var(--ink-2); }
.empty b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); padding-left: 6px; }
.inp { height: 50px; padding: 0 18px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.7); font-size: 15px; font-weight: 700; color: var(--ink); outline: none; width: 100%; }
.inp:focus { border-color: var(--navy); }

}
function logo(name, size) { return badge(acctInfo(name), size || 40); }
function ring(pct, color, size, inner, icon, iconColor) {
  var deg = Math.round(Math.max(0, Math.min(100, pct)) * 3.6);

function txRow(t) {

function applyTheme(t) {
  t = THEMES.some(function (x) { return x[0] === t; }) ? t : 'biru';
  if (t === 'biru') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('catat_theme', t); } catch (e) {}
  var meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', THEMES.filter(function (x) { return x[0] === t; })[0][3]);
}

function pinKey(v, scope) {
  if (S.busy) return;

  render();

  var pin = S.pin;
  setTimeout(function () {
    if (scope === 'lock') {
      S.busy = true; render();

        S.busy = false; S.pin = '';
        if (r.ok) { setUnlocked(); go('home'); } else { render(); shake(); }
      }).catch(fail);
      return;
    }
    if (!S.pinFirst) { S.pinFirst = pin; S.pin = ''; render(); return; }
    if (S.pinFirst !== pin) { S.pinFirst = ''; S.pin = ''; render(); shake(); toast('PIN tidak sama, ulangi.'); return; }
    if (scope === 'ob') { S.ob.pin = pin; S.pinFirst = ''; finishOnboarding(); return; }

}

/* ---------------- Catat manual ---------------- */
function addInit() {
  var accts = S.boot.accounts.filter(function (a) { return a.active; });
  var cash = accts.filter(function (a) { return a.mode === 'manual'; })[0] || accts[0] || { name: 'Tunai' };
  S.add = { mode: 'smart', text: '', type: 'Expense', amount: 0, desc: '', account: cash.name, category: '', when: 0, parsed: null };
}
function smartParse(text) {
  var raw = String(text || '').trim(), low = raw.toLowerCase();
  if (!raw) return null;
  var amount = 0, m = low.match(/(?:rp\.?\s*)?(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![a-z])/);
  if (m) {
    var n = parseFloat(m[1].replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')) || 0;
    if (/^(rb|ribu|k)$/.test(m[2] || '')) n *= 1e3;
    if (/^(jt|juta)$/.test(m[2] || '')) n *= 1e6;
    amount = Math.round(n);
  }
  var account = '';
  S.boot.accounts.concat(S.boot.catalog).some(function (a) {
    var re = new RegExp('(^|[^a-z])' + a.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z]|$)');
    if (re.test(low)) { account = a.name; return true; }
    return false;
  });
  if (!account && /(tunai|cash)/.test(low)) account = (S.boot.accounts.filter(function (a) { return a.mode === 'manual'; })[0] || { name: 'Tunai' }).name;
  var isIn = /(gaji|dapat|terima|masuk|bonus|thr|dibayar)/.test(low);
  var when = /kemarin/.test(low) ? -1 : 0;
  var desc = m ? raw.slice(0, m.index) + ' ' + raw.slice(m.index + m[0].length) : raw;
  desc = desc.replace(/\b(pakai|pake|via|dari|dengan|bayar|tunai|cash|kemarin|hari ini)\b/gi, ' ');
  if (account) desc = desc.replace(new RegExp(account.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), ' ');
  desc = desc.replace(/\s+/g, ' ').trim();
  desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : '';
  var category = '';
  var pool = isIn ? incomeCats() : expenseCats();
  pool.some(function (c) {
    return (c.keywords || []).some(function (k) {
      var re = new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)');
      if (re.test(low)) { category = c.name; return true; }
      return false;
    });
  });
  return { amount: amount, account: account, desc: desc, type: isIn ? 'Income' : 'Expense', category: category, when: when };
}

function historyLine(h) {

    (S.histBusy ? '' : ' · <button class="link" data-act="historyRun" style="font-size:12px">Percepat</button>') + '</div>';

function historyCard(h) {
  if (!h || h.done || !h.target) return '';

  return '<section class="glass pad-s" style="display:flex;gap:12px;align-items:center;border-radius:26px;border-style:dashed"><span style="width:40px;height:40px;border-radius:99px;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;flex-shrink:0">' + (S.histBusy ? '<span class="spin" style="width:18px;height:18px"></span>' : ic('sync', 'ic-s')) + '</span>' +

// Ambil riwayat terus-menerus selama halaman Beranda / Rekap masih terbuka.
function historyRun() {
  if (S.histBusy) return;
  S.histBusy = true; render();
  api('sync', { historyOnly: true }).then(function (r) {
    S.histBusy = false;
    invalidate('home', 'year', 'insight', 'tx', 'alloc');
    if (r.backfill && !r.backfill.done && r.ok !== false && (S.route === 'year' || S.route === 'home')) { render(); setTimeout(historyRun, 300); }
    else { if (r.backfill && r.backfill.done) toast('Riwayat email lengkap'); render(); }
  }).catch(function (e) { S.histBusy = false; toast(e.message); render(); });

VIEWS.alloc = function () {
  S.planTab = 'alloc';

  var editing = !!S.ae;
  var hdr = header('Rencana', 'none', editing

  if (!d) return frame(hdr + loading(), { nav: 'plan' });
  if (d.__error) return frame(hdr + errBox(d), { nav: 'plan' });
  var tpls = [[50, 20, 30], [50, 30, 20], [60, 20, 20]];
  var cur = editing ? S.ae : d.pct;
  var seg = '<div class="seg">' + tpls.map(function (t) {
    var on = cur.need === t[0] && cur.want === t[1] && cur.save === t[2];

  }).join('') + '</div>';
  var colors = { need: '#7FA7FF', want: '#F08A3C', save: '#8FD9AE' };
  var hero = '<section class="navy-card pad"><div style="display:flex;justify-content:space-between;align-items:center"><span class="small" style="color:var(--dark-text-3)">' + (d.usingExpected ? 'Perkiraan pemasukan' : 'Pemasukan ' + ymLabel(m)) + '</span><span class="pill" style="background:var(--ice);color:var(--navy)">' + (d.pct.need + d.pct.want + d.pct.save) + '% teralokasi</span></div>' +
    '<div style="margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-.05em">' + rp(d.base) + '</div>' +
    '<div style="display:flex;gap:4px;height:18px;margin-top:16px" aria-hidden="true"><span style="flex:' + d.pct.need + ';border-radius:99px 4px 4px 99px;background:' + colors.need + '"></span><span style="flex:' + d.pct.want + ';border-radius:4px;background:' + colors.want + '"></span><span style="flex:' + d.pct.save + ';border-radius:4px 99px 99px 4px;background:' + colors.save + '"></span></div>' +
    '<div class="grid3" style="margin-top:14px">' + d.groups.map(function (g) {
      return '<div><div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--dark-text-3)"><span style="width:8px;height:8px;border-radius:99px;background:' + colors[g.key] + '"></span>' + g.name.split(' ')[0] + ' ' + d.pct[g.key] + '%</div><b style="font-size:15px">' + short(g.amount) + '</b></div>';
    }).join('') + '</div>' +
    (d.base ? '' : '<p class="small" style="margin:12px 0 0;color:var(--ice)">Isi perkiraan pemasukan (ikon pensil) supaya jatah bisa dihitung.</p>') + '</section>';
  var editBox = editing ? '<section class="glass pad" style="display:flex;flex-direction:column;gap:10px"><div class="field"><label for="ae-income">Perkiraan pemasukan per bulan</label><input id="ae-income" class="inp" inputmode="numeric" data-input="aeIncome" value="' + (S.ae.income ? S.ae.income.toLocaleString('id-ID') : '') + '"></div>' +
    '<div class="grid3">' + [['need', 'Kebutuhan'], ['want', 'Keinginan'], ['save', 'Tabungan']].map(function (k) { return '<div class="field"><label for="ae-' + k[0] + '">' + k[1] + ' %</label><input id="ae-' + k[0] + '" class="inp" inputmode="numeric" data-input="aePct" data-k="' + k[0] + '" value="' + S.ae[k[0]] + '"></div>'; }).join('') + '</div>' +
    '<span class="small muted" id="ae-sum">Total ' + (S.ae.need + S.ae.want + S.ae.save) + '% (harus 100%)</span></section>' : '';
  var groups = d.groups.map(function (g) {
    var items = g.items.map(function (it, i) {
      var isSave = g.key === 'save';
      var warn = !isSave && it.budget > 0 && it.pct >= 85;
      var over = !isSave && it.budget > 0 && it.pct > 100;
      var right = isSave ? (it.pct >= 100 ? '<span class="small" style="font-weight:700;color:var(--green)">✓ Terkirim</span>' : '<span class="small" style="font-weight:700;color:#8A3F0A">Belum dikirim</span>')
        : over ? '<span class="small" style="font-weight:700;color:var(--red)">Lewat ' + short(it.used - it.budget) + '</span>'
        : warn ? '<span class="small" style="font-weight:700;color:#8A3F0A">Hampir habis</span>' : '<span class="small" style="font-weight:700;color:var(--ink-2)">' + (it.budget ? 'Sisa ' + short(Math.max(0, it.budget - it.used)) : 'Tanpa jatah') + '</span>';
      var budgetCtl = editing && !isSave ? '<input class="inp" inputmode="numeric" data-input="aeBudget" data-name="' + esc(it.name) + '" value="' + ((S.ae.budgets[it.name] !== undefined ? S.ae.budgets[it.name] : it.budget) || '').toLocaleString('id-ID') + '" aria-label="Jatah ' + esc(it.name) + '" style="height:38px;margin-top:6px;font-size:13px">' : '';
      return '<div class="trow" style="align-items:flex-start' + (i ? '' : ';border-top:0') + '"><span class="ticon" style="width:40px;height:40px;color:' + esc(it.color || 'var(--navy-2)') + '">' + ic(isSave ? (it.icon || 'target') : catIcon(it.key, it.name), 'ic-s') + '</span><span class="tmain"><span style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">' + esc(it.name) + '</b>' + right + '</span>' +
        '<span class="bar thin" style="display:block;margin-top:6px"><i style="width:' + Math.min(100, it.pct) + '%;background:' + (isSave ? 'var(--green)' : warn ? 'var(--orange)' : '#2E55B0') + '"></i></span>' +
        '<span class="small" style="display:block;margin-top:4px;font-weight:600;color:var(--ink-3)">' + short(it.used) + (it.budget ? ' dari ' + short(it.budget) + ' · ' + it.pct + '%' : '') + (isSave ? ' ditabung' : '') + '</span>' + budgetCtl + '</span></div>';
    }).join('');
    return '<section class="glass" style="padding:16px 16px 8px;border-radius:30px"><div style="display:flex;align-items:center;gap:10px"><span style="width:12px;height:12px;border-radius:99px;background:' + colors[g.key] + '"></span><b style="flex:1;font-size:16px">' + g.name + '</b><span class="small" style="font-weight:700;color:var(--ink-2)">' + short(g.used) + ' <span class="muted">/ ' + short(g.amount) + '</span></span></div>' +
      (items || '<div class="empty small">' + (g.key === 'save' ? (isPremium() ? 'Belum ada goal. Buat di menu Rencana → Goals.' : 'Goals &amp; tabungan otomatis tersedia di versi Premium.') : 'Belum ada pengeluaran di kelompok ini.') + '</div>') + '</section>';
  }).join('');
  return frame(hdr + '<div class="cols"><div class="col">' + seg + hero + editBox + '</div><div class="col">' + groups + '</div></div>', { nav: 'plan' });
};

  gfSave: function () {
    var F = S.gf;
    if (!F.name.trim() || !(F.target > 0)) { toast('Isi nama dan target goal.'); return; }
    var deadline = F.deadline ? new Date(Number(F.deadline.split('-')[0]), Number(F.deadline.split('-')[1]), 0).toISOString() : '';
    S.busy = true; render();
    api('saveGoal', { id: F.id, name: F.name, target: F.target, current: F.current, deadline: deadline, linkedAccount: F.linkedAccount, icon: F.icon, color: F.color }).then(function () {
      S.busy = false; invalidate('goal', 'alloc', 'home'); toast('Goal tersimpan'); back();
    }).catch(fail);
  },
  goalDelete: function () {
    if (!confirm('Arsipkan goal ini?')) return;
    api('deleteGoal', { id: S.params.id }).then(function () { invalidate('goal', 'alloc'); toast('Goal diarsipkan'); back(); }).catch(fail);
  },
  depOpen: function () { S.dep.open = !S.dep.open; render(); var el = document.getElementById('dep-amt'); if (el) el.focus(); },
  depSave: function () {
    if (!S.dep.amount) { toast('Isi nominal setoran.'); return; }
    S.busy = true; render();
    api('addDeposit', { goalId: S.dep.id, amount: S.dep.amount, note: S.dep.note }).then(function () {
      S.busy = false; S.dep = null; invalidate('goal', 'alloc', 'home'); toast('Setoran tercatat'); render();
    }).catch(fail);
  },
  aeOpen: function () {
    var d = S.data['alloc:' + ym()];
    S.ae = { need: d.pct.need, want: d.pct.want, save: d.pct.save, income: S.boot.settings.expectedIncome || d.base, budgets: {} };
    render();
  },
  allocTpl: function (ds) {
    var t = ds.v.split('/').map(Number);
    if (S.ae) { S.ae.need = t[0]; S.ae.want = t[1]; S.ae.save = t[2]; render(); return; }
    api('saveAllocation', { need: t[0], want: t[1], save: t[2] }).then(function () {
      S.boot.settings.allocNeed = t[0]; S.boot.settings.allocWant = t[1]; S.boot.settings.allocSave = t[2];
      invalidate('alloc', 'home'); toast('Pola alokasi diganti'); render();
    }).catch(fail);
  },
  aeSave: function () {
    var A = S.ae;
    if (A.need + A.want + A.save !== 100) { toast('Persentase harus berjumlah 100%.'); return; }
    S.busy = true;
    api('saveAllocation', { need: A.need, want: A.want, save: A.save, expectedIncome: A.income, budgets: A.budgets }).then(function () {
      S.busy = false; S.boot.settings.allocNeed = A.need; S.boot.settings.allocWant = A.want; S.boot.settings.allocSave = A.save; S.boot.settings.expectedIncome = A.income;
      S.ae = null; invalidate('alloc', 'home'); toast('Alokasi tersimpan'); render();
    }).catch(fail);
  }
};

// Input teks: ubah state tanpa render ulang penuh (supaya kursor tidak hilang)
var INPUT = {
  obNick: function (el) { S.ob.nickname = el.value; },
  obIncome: function (el) { var v = digits(el.value); S.ob.income = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  txQ: function (el) {
    clearTimeout(INPUT._t);
    INPUT._t = setTimeout(function () { S.txQ = el.value.trim(); S.focus = { id: 'tx-q', pos: el.selectionStart }; render(); }, 350);
  },
  addText: function (el) {
    S.add.text = el.value; applyParse();
    var box = document.getElementById('add-parsed'); if (box) box.innerHTML = parsedChips(S.add.parsed);
    var btn = document.getElementById('add-save'); if (btn) btn.disabled = !(S.add.parsed && S.add.parsed.amount > 0);
  },
  addAmt: function (el) { var v = digits(el.value); S.add.amount = v; el.value = v ? v.toLocaleString('id-ID') : ''; var btn = document.getElementById('add-save'); if (btn) btn.disabled = !(v > 0); },
  addDesc: function (el) { S.add.desc = el.value; },
  akunNick: function (el) { S.akun.nickname = el.value; },
  gfName: function (el) { S.gf.name = el.value; },
  gfTarget: function (el) { var v = digits(el.value); S.gf.target = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  gfCurrent: function (el) { var v = digits(el.value); S.gf.current = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  gfDeadline: function (el) { S.gf.deadline = el.value; },
  depAmt: function (el) { var neg = /^\s*-/.test(el.value); var v = digits(el.value); S.dep.amount = neg ? -v : v; el.value = v ? (neg ? '-' : '') + v.toLocaleString('id-ID') : (neg ? '-' : ''); },
  depNote: function (el) { S.dep.note = el.value; },
  licCode: function (el) { S.lic.code = el.value.toUpperCase(); },
  obCode: function (el) { S.ob.code = el.value.toUpperCase(); S.ob.codeOk = false; },
  fMin: function (el) { var v = digits(el.value); S.fsheet.draft.min = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  fMax: function (el) { var v = digits(el.value); S.fsheet.draft.max = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  wkHour: function (el) { S.wk.hour = Number(el.value); render(); },
  wkCc: function (el) { S.wk.cc = el.value; },
  forgotCode: function (el) { var v = String(el.value).replace(/\D/g, '').slice(0, 6); el.value = v; S.forgot.code = v; var b = document.getElementById('fp-go'); if (b) b.disabled = v.length !== 6; },
  aeIncome: function (el) { var v = digits(el.value); S.ae.income = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  aePct: function (el) { S.ae[el.dataset.k] = Math.min(100, digits(el.value)); var s = document.getElementById('ae-sum'); if (s) s.textContent = 'Total ' + (S.ae.need + S.ae.want + S.ae.save) + '% (harus 100%)'; },
  aeBudget: function (el) { var v = digits(el.value); S.ae.budgets[el.dataset.name] = v; el.value = v ? v.toLocaleString('id-ID') : ''; }
};
var CHANGE = {
  obTrack: function (el) { S.ob.trackIncome = el.checked; },
  obWeekly: function (el) { S.ob.weekly = el.checked; },
  detRemember: function (el) { S.det.remember = el.checked; },
  setTrack: function (el) { saveSetting('trackIncome', el.checked); },
  setWeekly: function (el) { saveSetting('weeklyReviewEnabled', el.checked); },
  setPin: function (el) {
    if (el.checked) { S.pin = ''; S.pinFirst = ''; go('pinSet'); return; }
    api('clearPin', {}).then(function () { S.boot.hasPin = false; toast('PIN dimatikan'); render(); }).catch(fail);
  }
};
function saveSetting(k, v) {
  var p = {}; p[k] = v;
  api('saveSettings', p).then(function () { S.boot.settings[k] = v; invalidate('home'); toast('Pengaturan tersimpan'); }).catch(fail);
}
function applyParse() {
  var p = smartParse(S.add.text);
  if (p && p.account) S.add.account = p.account;
  S.add.parsed = p;
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.input && INPUT[el.dataset.input]) INPUT[el.dataset.input](el);
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.quick) { S.quick = false; S.add = null; render(); return; }
  var el = e.target;
  if (!el.dataset || el.dataset.enter !== 'ownerAdd') return;
  var list = el.dataset.scope === 'ob' ? S.ob.owners : S.akun.owners;
  if ((e.key === 'Enter' || e.key === ',') && el.value.trim()) {
    e.preventDefault();
    if (list.map(function (x) { return x.toLowerCase(); }).indexOf(el.value.trim().toLowerCase()) === -1) list.push(el.value.trim());
    S.focus = { id: el.id, pos: 0 }; render();
  } else if (e.key === 'Backspace' && !el.value && list.length) {
    list.pop(); S.focus = { id: el.id, pos: 0 }; render();
  }
});

VIEWS.sources = function () { return sourcesView('edit'); };

/* ---------------- Mulai ---------------- */
function start() {
  api('bootstrap').then(function (b) {
    S.boot = b;
    applyTheme(b.settings.theme);
    if (!b.onboarded) S.route = 'intro';
    else if (b.hasPin && !isUnlocked()) S.route = 'lock';
    else S.route = 'home';
    render();
  }).catch(function (e) {
    document.getElementById('app').innerHTML = darkFrame('<h1 class="d-title">Ada yang<br><span>belum siap.</span></h1><p class="d-lede">' + esc(e.message) + '</p><p class="d-lede">Buka spreadsheet catat.id, lalu klik menu catat.id → ▶ Mulai / buka aplikasi.</p>');
  });
}
start();
</script>
