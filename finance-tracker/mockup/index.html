<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jejak — Mockup</title>
<meta name="theme-color" content="#0E6B52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   JEJAK — Mockup UI (nama produk sementara, ganti di BRAND)
   Satu file, tanpa dependensi. Data contoh disimpan di localStorage.
   ========================================================= */
:root {
  --bg: #F4F3EF;
  --surface: #FFFFFF;
  --surface-2: #F8F7F3;
  --surface-3: #EFEDE7;
  --ink: #121417;
  --ink-2: #3B4047;
  --muted: #767B83;
  --faint: #A3A7AE;
  --line: #E5E3DC;
  --line-soft: #EEECE6;

  --accent: #0E6B52;
  --accent-2: #0B5743;
  --accent-soft: #E2F0EA;
  --accent-ink: #FFFFFF;
  --lime: #C8F169;

  --hero: #101513;
  --hero-2: #17201C;
  --hero-ink: #F3F5F2;
  --hero-muted: #9AA7A0;

  --warn: #A9590B;
  --warn-soft: #FBEEDB;
  --danger: #B83227;
  --danger-soft: #FAE5E2;
  --info: #2C57C9;
  --info-soft: #E5ECFB;

  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --r-xl: 28px;

  --sh-1: 0 1px 2px rgba(18, 20, 23, .04), 0 1px 1px rgba(18, 20, 23, .03);
  --sh-2: 0 6px 24px rgba(18, 20, 23, .07);
  --sh-3: 0 24px 64px rgba(18, 20, 23, .16);

  --ease: cubic-bezier(.2, .8, .2, 1);
  --nav-h: 72px;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0C0E10;
  --surface: #14171A;
  --surface-2: #191D21;
  --surface-3: #20252A;
  --ink: #F1F2EF;
  --ink-2: #C9CDD1;
  --muted: #8C9299;
  --faint: #626870;
  --line: #262B31;
  --line-soft: #1F2429;
  --accent: #3DBE92;
  --accent-2: #5BD3A9;
  --accent-soft: rgba(61, 190, 146, .14);
  --accent-ink: #06231A;
  --hero: #0F1A16;
  --hero-2: #14231D;
  --warn: #F0A54B;
  --warn-soft: rgba(240, 165, 75, .14);
  --danger: #F07A6E;
  --danger-soft: rgba(240, 122, 110, .14);
  --info: #7FA2FF;
  --info-soft: rgba(127, 162, 255, .14);
  --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
  --sh-2: 0 8px 28px rgba(0, 0, 0, .35);
  --sh-3: 0 24px 64px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1, "cv11" 1;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 20px; border-radius: 14px;
  font-weight: 700; font-size: 15px; letter-spacing: -.01em;
  transition: transform .15s var(--ease), background .2s, box-shadow .2s, opacity .2s;
  white-space: nowrap;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn-primary:hover { background: var(--accent-2); }
.btn-dark { background: var(--ink); color: var(--bg); }
.btn-soft { background: var(--surface-3); color: var(--ink); }
.btn-soft:hover { background: var(--line); }
.btn-ghost { color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-3); }
.btn-outline { border: 1px solid var(--line); background: var(--surface); }
.btn-outline:hover { background: var(--surface-2); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-block { width: 100%; }
.btn-sm { height: 36px; padding: 0 14px; border-radius: 11px; font-size: 13px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center;
  color: var(--ink-2); transition: background .2s;
}
.icon-btn:hover { background: var(--surface-3); }
.link { color: var(--accent); font-weight: 700; }

/* ---------- Icons ---------- */
.ic { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 16px; height: 16px; }
.ic-lg { width: 24px; height: 24px; }

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.hint { font-size: 13px; color: var(--muted); line-height: 1.5; }
.input {
  height: 52px; padding: 0 16px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 16px; font-weight: 600; outline: none; width: 100%;
  transition: border-color .2s, box-shadow .2s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input-money { font-size: 28px; font-weight: 800; height: 64px; letter-spacing: -.03em; }
.input-wrap { position: relative; }
.input-prefix { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--muted); }
.input-wrap .input { padding-left: 48px; }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; font-weight: 700; color: var(--ink-2);
  transition: all .18s var(--ease);
}
.chip:hover { border-color: var(--faint); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 99px; }
.chip-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px; }
.chip-scroll::-webkit-scrollbar { display: none; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .01em; white-space: nowrap;
}
.badge-accent { background: var(--accent-soft); color: var(--accent); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-muted { background: var(--surface-3); color: var(--muted); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-lg); box-shadow: var(--sh-1); }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
.card-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.section-title { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* ---------- Tiles & rows ---------- */
.tile {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0;
  font-weight: 800; font-size: 13px; letter-spacing: -.02em;
}
.tile-sm { width: 34px; height: 34px; border-radius: 10px; font-size: 11px; }
.row {
  display: flex; align-items: center; gap: 14px; padding: 12px 0;
  width: 100%; text-align: left;
}
.row + .row { border-top: 1px solid var(--line-soft); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-amt { font-weight: 800; font-size: 15px; text-align: right; white-space: nowrap; }
.row-amt small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.tx-row { border-radius: 14px; padding: 12px 10px; margin: 0 -10px; width: calc(100% + 20px); transition: background .15s; }
.tx-row:hover { background: var(--surface-2); }
.tx-row + .tx-row { border-top: 0; }
.amt-out { color: var(--ink); }
.amt-transfer { color: var(--muted); }
.amt-in { color: var(--accent); }

/* =========================================================
   AUTH
   ========================================================= */
.auth { min-height: 100dvh; display: grid; grid-template-columns: 1fr; }
.auth-brand {
  position: relative; overflow: hidden;
  background: radial-gradient(120% 90% at 0% 0%, #1D3A30 0%, var(--hero) 55%);
  color: var(--hero-ink); padding: 28px 24px 36px;
}
.auth-brand::after {
  content: ""; position: absolute; inset: auto -20% -40% auto; width: 420px; height: 420px; border-radius: 50%;
  background: radial-gradient(circle, rgba(200, 241, 105, .18), transparent 65%); pointer-events: none;
}
.logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.03em; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 11px; background: var(--lime); color: #0D1A14;
  display: grid; place-items: center;
}
.auth-headline { font-size: clamp(30px, 6vw, 52px); line-height: 1.04; font-weight: 800; letter-spacing: -.045em; margin: 36px 0 14px; max-width: 12ch; }
.auth-headline em { font-style: normal; color: var(--lime); }
.auth-lede { color: var(--hero-muted); font-size: 16px; max-width: 40ch; margin: 0; }
.float-stack { position: relative; margin-top: 30px; display: grid; gap: 10px; max-width: 380px; }
.float-card {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px;
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .09);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  animation: floatIn .7s var(--ease) both;
}
.float-card:nth-child(2) { animation-delay: .12s; margin-left: 22px; }
.float-card:nth-child(3) { animation-delay: .24s; margin-left: 8px; }
.float-card .t1 { font-size: 13px; font-weight: 700; }
.float-card .t2 { font-size: 12px; color: var(--hero-muted); }
.float-card .amt { margin-left: auto; font-weight: 800; font-size: 14px; }
.float-arrow { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(200, 241, 105, .14); color: var(--lime); }
@keyframes floatIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.auth-panel { display: flex; align-items: center; justify-content: center; padding: 32px 20px 40px; }
.auth-box { width: 100%; max-width: 400px; }
.auth-box h2 { font-size: 26px; font-weight: 800; letter-spacing: -.035em; margin: 0 0 6px; }
.auth-box p.sub { color: var(--muted); margin: 0 0 28px; }
.btn-google { height: 54px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 15px; font-weight: 700; gap: 12px; box-shadow: var(--sh-1); }
.btn-google:hover { background: var(--surface-2); }
.trust { margin-top: 26px; display: grid; gap: 14px; }
.trust-item { display: flex; gap: 12px; align-items: flex-start; }
.trust-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.trust-item b { display: block; font-size: 14px; }
.trust-item span { font-size: 13px; color: var(--muted); }
.legal { margin-top: 28px; font-size: 12px; color: var(--faint); text-align: center; }

@media (min-width: 960px) {
  .auth { grid-template-columns: 1.08fr 1fr; }
  .auth-brand { padding: 44px 56px; display: flex; flex-direction: column; }
  .auth-brand .brand-body { margin-top: auto; margin-bottom: auto; }
  .auth-headline { margin-top: 0; }
  .float-stack { margin-top: 40px; }
}

/* =========================================================
   ONBOARDING
   ========================================================= */
.ob { min-height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: 20px 20px 28px; }
.ob-top { display: flex; align-items: center; gap: 12px; height: 44px; }
.ob-progress { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ob-progress span { height: 4px; border-radius: 9px; background: var(--line); transition: background .3s; }
.ob-progress span.on { background: var(--accent); }
.ob-step { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 34px; text-align: right; }
.ob-body { flex: 1; padding-top: 26px; animation: stepIn .45s var(--ease) both; }
@keyframes stepIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.ob-kicker { font-size: 13px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; }
.ob-title { font-size: 28px; line-height: 1.12; font-weight: 800; letter-spacing: -.04em; margin: 8px 0 10px; }
.ob-desc { color: var(--muted); margin: 0 0 26px; }
.ob-foot { display: flex; gap: 10px; padding-top: 20px; position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-bottom: 4px; }
.ob-foot .btn-primary { flex: 1; }
.stack { display: grid; gap: 18px; }

.tag-input { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; min-height: 52px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); align-items: center; }
.tag-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 12px; border-radius: 10px; background: var(--surface-3); font-weight: 700; font-size: 13px; }
.tag button { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.tag button:hover { background: var(--line); }
.tag-input input { flex: 1; min-width: 140px; border: 0; outline: none; background: transparent; height: 34px; font-weight: 600; padding: 0 6px; }

.src-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.src-legend span { display: inline-flex; align-items: center; gap: 6px; }
.src-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.src {
  display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px;
  border: 1.5px solid var(--line); background: var(--surface); text-align: left; position: relative;
  transition: border-color .18s, background .18s, transform .15s;
}
.src:active { transform: scale(.98); }
.src.on { border-color: var(--accent); background: var(--accent-soft); }
.src .name { font-weight: 700; font-size: 14px; line-height: 1.2; }
.src .mode { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.src .check { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 99px; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; transition: all .18s; }
.src.on .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.note {
  display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line-soft);
  font-size: 13px; color: var(--ink-2); line-height: 1.55;
}
.note .ic { color: var(--accent); margin-top: 1px; }
.note b { color: var(--ink); }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line-soft); }
.toggle-row b { display: block; font-size: 15px; }
.toggle-row span { font-size: 13px; color: var(--muted); }
.switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; inset: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 99px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .22s var(--ease); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }

/* PIN */
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 8px 0 28px; }
.pin-dots span { width: 14px; height: 14px; border-radius: 99px; border: 2px solid var(--faint); transition: all .15s; }
.pin-dots span.on { background: var(--ink); border-color: var(--ink); transform: scale(1.05); }
.pin-dots.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; }
.key { height: 62px; border-radius: 18px; font-size: 24px; font-weight: 700; background: var(--surface); border: 1px solid var(--line-soft); transition: background .12s, transform .1s; }
.key:active { transform: scale(.96); background: var(--surface-3); }
.key.ghost { background: transparent; border-color: transparent; font-size: 14px; color: var(--muted); }

/* Sync screen */
.sync { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; text-align: center; }
.sync-orb { width: 104px; height: 104px; border-radius: 32px; display: grid; place-items: center; background: var(--hero); color: var(--lime); position: relative; margin-bottom: 26px; box-shadow: var(--sh-2); }
.sync-orb::before { content: ""; position: absolute; inset: -8px; border-radius: 38px; border: 2px solid var(--accent); opacity: .35; animation: pulse 1.8s var(--ease) infinite; }
.sync-orb.done::before { animation: none; opacity: 0; }
@keyframes pulse { 0% { transform: scale(.94); opacity: .5; } 100% { transform: scale(1.12); opacity: 0; } }
.sync h2 { font-size: 26px; letter-spacing: -.035em; margin: 0 0 6px; }
.sync p { color: var(--muted); margin: 0 0 26px; max-width: 34ch; }
.sync-list { width: 100%; max-width: 420px; text-align: left; }
.sync-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-soft); margin-bottom: 8px; opacity: .45; transition: opacity .3s; }
.sync-item.active, .sync-item.ok { opacity: 1; }
.sync-item .st { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync-item.ok .st { color: var(--accent); }
.spin { width: 16px; height: 16px; border-radius: 99px; border: 2px solid var(--line); border-top-color: var(--accent); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.sync-result { width: 100%; max-width: 420px; margin-top: 10px; animation: floatIn .5s var(--ease) both; }

/* =========================================================
   APP SHELL
   ========================================================= */
.shell { min-height: 100dvh; }
.side { display: none; }
.main { padding: 0 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); max-width: 1180px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 18px 0 14px; position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.topbar h1 { font-size: 22px; letter-spacing: -.035em; margin: 0; font-weight: 800; flex: 1; min-width: 0; }
.topbar .greet { flex: 1; min-width: 0; }
.topbar .greet small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.topbar .greet b { display: block; font-size: 20px; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 40px; height: 40px; border-radius: 13px; background: var(--hero); color: var(--lime); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
.sync-chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line-soft); font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.sync-chip i { width: 7px; height: 7px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.bottom-nav {
  position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40;
  height: var(--nav-h); border-radius: 24px; padding: 8px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line-soft); box-shadow: var(--sh-2);

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function seedTransactions(sources) {

  const allowed = new Set(sources);
  const total = TEMPLATES.reduce((s, t) => s + t[5], 0);
  const out = [];
  const now = new Date();
  for (let d = 0; d < 46; d++) {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() - d);
    const n = 1 + Math.floor(r() * 4);
    for (let k = 0; k < n; k++) {
      let x = r() * total, t = TEMPLATES[0];
      for (const tpl of TEMPLATES) { x -= tpl[5]; if (x <= 0) { t = tpl; break; } }
      let acct = pick(t[4]);
      if (!allowed.has(acct)) acct = sources.find(s => s !== 'cash') || 'cash';
      const amt = Math.round((t[2] + r() * (t[3] - t[2])) / 500) * 500;
      const hour = 7 + Math.floor(r() * 15);
      const ts = new Date(day); ts.setHours(hour, Math.floor(r() * 60));
      if (d === 0 && ts > now) ts.setTime(now.getTime() - (k + 1) * 47 * 60000);
      out.push(mkTx({ ts: ts.getTime(), merchant: t[0], cat: t[1], amount: amt, account: acct }));
    }
  }
  // tagihan bulanan & top-up

      .forEach(([dd, h, mer, cat, amt]) => { const ts = at(dd, h); if (ts) out.push(mkTx({ ts, merchant: mer, cat, amount: amt, account: firstBank })); });
    if (wallet) [4, 15, 24].forEach(dd => {

      out.push(mkTx({ ts: ts + 1000, merchant: `Biaya admin top-up ${SRC[wallet].name}`, cat: 'fee', amount: 1000, account: firstBank }));
    });
  });
  // antrean "perlu dicek" dari parser universal
  const smartSrc = sources.filter(s => SRC[s].mode === 'smart');
  const rv = (i, extra) => {

    return mkTx(Object.assign({ account: src, status: 'review' }, extra));
  };
  const owner = (S.user.owners[0] || S.user.name || 'Raka Pratama').toUpperCase();
  out.push(rv(0, { ts: now.getTime() - 38 * 60000, merchant: 'QRIS MIE GACOAN BOGOR', cat: 'food', amount: 52000, conf: .78,
    raw: 'Transaksi QRIS berhasil · Rp52.000 · MIE GACOAN BOGOR' }));
  out.push(rv(1, { ts: now.getTime() - 5 * 3600000, merchant: `Transfer ke ${owner}`, cat: 'transfer', amount: 500000, conf: .64, selfGuess: true,
    raw: `Transfer keluar Rp500.000 ke ${owner} · rek ****8821` }));
  out.push(rv(2, { ts: now.getTime() - 27 * 3600000, merchant: 'Pembayaran ke 0812****4410', cat: 'other', amount: 150000, conf: .41,
    raw: 'Pembayaran berhasil Rp150.000 ke 0812****4410' }));
  return out.sort((a, b) => b.ts - a.ts);
}

/* ---------- Kalkulasi ---------- */
const counted = t => t.type === 'expense' && t.status === 'ok';
function monthRange(offset = 0) {
  const n = new Date();
  return [new Date(n.getFullYear(), n.getMonth() + offset, 1).getTime(), new Date(n.getFullYear(), n.getMonth() + offset + 1, 1).getTime()];
}
function stats() {
  const now = new Date();
  const [ms, me] = monthRange(0);
  const [ps] = monthRange(-1);
  const prevCut = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate(), 23, 59).getTime();
  const month = S.tx.filter(t => counted(t) && t.ts >= ms && t.ts < me);
  const spent = month.reduce((s, t) => s + t.amount, 0);
  const prevSame = S.tx.filter(t => counted(t) && t.ts >= ps && t.ts <= prevCut).reduce((s, t) => s + t.amount, 0);
  const daysIn = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const day = now.getDate();
  const left = S.ob.budget - spent;
  const daysLeft = daysIn - day + 1;
  const byCat = {};
  month.forEach(t => { byCat[t.cat] = (byCat[t.cat] || 0) + t.amount; });
  const cats = Object.entries(byCat).map(([id, v]) => ({ id, v })).sort((a, b) => b.v - a.v);
  const daily = Array.from({ length: daysIn }, (_, i) => month.filter(t => new Date(t.ts).getDate() === i + 1).reduce((s, t) => s + t.amount, 0));
  const groups = { need: 0, want: 0 };
  month.forEach(t => { const g = (CAT[t.cat] || CAT.other).group; if (groups[g] !== undefined) groups[g] += t.amount; });
  return {
    spent, prevSame, delta: prevSame ? Math.round((spent - prevSame) / prevSame * 100) : 0,
    left, daysLeft, perDay: Math.max(0, left / daysLeft), avg: spent / day, count: month.length,
    pct: Math.min(100, spent / S.ob.budget * 100), timePct: day / daysIn * 100,
    cats, daily, day, daysIn, groups,
    review: S.tx.filter(t => t.status === 'review')
  };
}
function weekStats() {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const start = sod(new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow)).getTime();
  const prevStart = start - 7 * 864e5;
  const cur = S.tx.filter(t => counted(t) && t.ts >= start);
  const prevSame = S.tx.filter(t => counted(t) && t.ts >= prevStart && t.ts < prevStart + (Date.now() - start));
  const sum = a => a.reduce((s, t) => s + t.amount, 0);
  const coffee = sum(cur.filter(t => t.cat === 'coffee'));
  const top = {}; cur.forEach(t => { top[t.merchant] = (top[t.merchant] || 0) + 1; });
  const fav = Object.entries(top).sort((a, b) => b[1] - a[1])[0];
  return { total: sum(cur), prev: sum(prevSame), coffee, fav, count: cur.length, start };
}

function pinPad(handler) {

  return `

function pinUpdate(cb) {
  const dots = document.querySelectorAll('#pin-dots span');

function pinShake() {

   3. SINKRONISASI PERTAMA
   ========================================================= */
function viewSync() {
  const list = S.ob.sources.filter(s => SRC[s].mode !== 'manual');
  return `
  <main class="sync">
    <div class="sync-orb" id="sync-orb">${ic('mail', 'ic-lg')}</div>

    <p id="sync-desc">Kami memindai notifikasi 30 hari terakhir. Biasanya kurang dari satu menit.</p>
    <div class="sync-list">
      ${list.map(id => `<div class="sync-item" id="si-${id}">${srcTile(id, true)}<div><b style="font-size:14px">${esc(SRC[id].name)}</b><div style="font-size:12px;color:var(--muted)">${MODE_LABEL[SRC[id].mode]}</div></div><div class="st">Menunggu</div></div>`).join('')}
    </div>
    <div id="sync-result"></div>
  </main>`;
}
function runSync() {
  const list = S.ob.sources.filter(s => SRC[s].mode !== 'manual');
  _id = 0;
  S.tx = seedTransactions(S.ob.sources);
  const since = Date.now() - 30 * 864e5;
  const counts = Object.fromEntries(list.map(id => [id, S.tx.filter(t => t.account === id && t.ts >= since).length]));
  let i = 0;
  const step = () => {
    if (i > 0) {
      const prev = document.getElementById('si-' + list[i - 1]);
      if (prev) { prev.className = 'sync-item ok'; prev.querySelector('.st').innerHTML = `${ic('check', 'ic-sm')} ${counts[list[i - 1]]} transaksi`; }
    }
    if (i >= list.length) return done();
    const cur = document.getElementById('si-' + list[i]);
    if (cur) { cur.className = 'sync-item active'; cur.querySelector('.st').innerHTML = '<span class="spin"></span> Membaca'; }
    i++;
    setTimeout(step, 650 + Math.random() * 450);
  };
  const done = () => {
    const total = S.tx.filter(t => t.ts >= since && t.source === 'email').length;
    const rv = S.tx.filter(t => t.status === 'review').length;
    S.lastSync = Date.now(); save();
    document.getElementById('sync-orb').classList.add('done');
    document.getElementById('sync-orb').innerHTML = ic('check', 'ic-lg');
    document.getElementById('sync-title').textContent = 'Semua beres!';
    document.getElementById('sync-desc').innerHTML = `<b class="num" style="color:var(--ink)">${total} transaksi</b> berhasil dicatat otomatis.`;
    document.getElementById('sync-result').innerHTML = `
      <div class="sync-result">
        ${rv ? `<div class="note" style="text-align:left;margin-bottom:14px">${ic('sparkle')}<div><b>${rv} transaksi perlu kamu cek sekilas.</b> Ini dari bank yang dibaca dengan mode pintar. Cukup sekali; selanjutnya ${BRAND.name} akan ingat.</div></div>` : ''}
        <button class="btn btn-primary btn-block" onclick="enterApp()">Lihat catatanku ${ic('right', 'ic-sm')}</button>
      </div>`;
  };
  setTimeout(step, 500);
}
function enterApp() { S.locked = false; go('home'); }

function viewTx() {
  const q = UI.txQuery.toLowerCase();
  const rvCount = S.tx.filter(t => t.status === 'review').length;
  const filters = [['all', 'Semua'], ['review', `Perlu dicek${rvCount ? ' · ' + rvCount : ''}`], ['expense', 'Pengeluaran'], ['transfer', 'Transfer'], ['manual', 'Catatan manual']];
  let list = S.tx.filter(t => {
    if (UI.txFilter === 'review' && t.status !== 'review') return false;
    if (UI.txFilter === 'expense' && (t.type !== 'expense' || t.status !== 'ok')) return false;
    if (UI.txFilter === 'transfer' && t.type !== 'transfer') return false;
    if (UI.txFilter === 'manual' && t.source !== 'manual') return false;
    if (q && !(`${t.merchant} ${(CAT[t.cat] || {}).name} ${SRC[t.account]?.name}`.toLowerCase().includes(q))) return false;
    return true;
  });
  const groups = [];
  list.forEach(t => {

function viewInsight() {
  const st = stats();
  const now = new Date();
  const max = Math.max(...st.daily, S.ob.budget / st.daysIn, 1) * 1.08;
  const W = 640, H = 170, pad = 22, bw = (W - pad) / st.daysIn;
  const yLine = H - pad - (S.ob.budget / st.daysIn) / max * (H - pad - 8);
  const bars = st.daily.map((v, i) => {
    const h = Math.max(v ? 3 : 0, v / max * (H - pad - 8));
    const cls = i + 1 === st.day ? 'today' : i + 1 > st.day ? 'future' : '';
    const fh = cls === 'future' ? 4 : h;
    return `<rect class="bar ${cls}" x="${pad + i * bw + bw * .18}" y="${H - pad - fh}" width="${bw * .64}" height="${fh}" rx="${Math.min(4, bw * .3)}"><title>${i + 1} ${MONTHS[now.getMonth()]}: ${rupiah(v)}</title></rect>`;
  }).join('');
  const labels = [1, 8, 15, 22, st.daysIn].map(d => `<text x="${pad + (d - 1) * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${d}</text>`).join('');
  const g = st.groups, gt = g.need + g.want || 1;
  const topMerchants = Object.entries(S.tx.filter(t => counted(t) && t.ts >= monthRange(0)[0]).reduce((m, t) => { m[t.merchant] = (m[t.merchant] || 0) + t.amount; return m; }, {}))
    .sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `
    <header class="topbar"><h1>Insight</h1><div class="seg"><button class="on">${MONTHS[now.getMonth()].slice(0, 3)}</button><button onclick="toast('Di versi asli: pilih bulan lain')">Pilih bulan</button></div></header>
    <div class="grid-home">
      <div class="col">
        <section class="card card-pad">
          <div class="card-head"><div><div class="card-title">Pengeluaran harian</div><div class="card-sub">Garis putus-putus = rata-rata batas per hari</div></div>
            <b class="num" style="font-size:18px">${rupiah(st.spent)}</b></div>
          <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pengeluaran harian">
            <line class="line" x1="${pad}" x2="${W}" y1="${yLine}" y2="${yLine}"/>${bars}${labels}
            <text x="0" y="${yLine + 3}">${short(S.ob.budget / st.daysIn)}</text>
          </svg>
        </section>
        <section class="card card-pad">
          <div class="card-head"><div><div class="card-title">Kebutuhan vs keinginan</div><div class="card-sub">Patokan sehat: keinginan di bawah 30%</div></div>
            <span class="badge ${g.want / gt <= .3 ? 'badge-accent' : 'badge-warn'}">${Math.round(g.want / gt * 100)}% keinginan</span></div>
          <div class="split"><i style="width:${g.need / gt * 100}%;background:var(--accent)"></i><i style="width:${g.want / gt * 100}%;background:var(--warn)"></i></div>
          <div class="legend"><span><i style="background:var(--accent)"></i>Kebutuhan <b class="num">${rupiah(g.need)}</b></span><span><i style="background:var(--warn)"></i>Keinginan <b class="num">${rupiah(g.want)}</b></span></div>
        </section>
      </div>
      <div class="col">
        <section class="card card-pad">
          <div class="card-head"><div class="card-title">Semua kategori</div></div>
          <div class="cat-bars">${st.cats.map(c => {
            const k = CAT[c.id] || CAT.other; const p = st.spent ? Math.round(c.v / st.spent * 100) : 0;
            return `<div class="cat-bar-row">${catTile(c.id, true)}<div><div class="cat-bar-top"><span>${k.name}</span><span class="num">${p}%</span></div><div class="meter"><i style="width:${p}%;background:${k.color}"></i></div></div><b class="num" style="font-size:14px">${short(c.v)}</b></div>`;
          }).join('')}</div>
        </section>
        <section class="card card-pad">
          <div class="card-head"><div class="card-title">Merchant teratas</div></div>
          ${topMerchants.map(([m, v], i) => `<div class="row"><span class="tile tile-sm" style="background:var(--surface-3);color:var(--ink-2)">${i + 1}</span><div class="row-main"><div class="row-title">${esc(m)}</div></div><b class="num">${rupiah(v)}</b></div>`).join('')}
        </section>
      </div>
    </div>`;
}

/* ---------- Review queue ---------- */
let RV = { ids: [], i: 0, cat: null };
function openReview(id) {
  const items = S.tx.filter(t => t.status === 'review');
  if (!items.length) return;
  RV.ids = items.map(t => t.id);
  if (id && RV.ids.includes(id)) RV.ids = [id, ...RV.ids.filter(x => x !== id)];
  RV.i = 0;
  RV.total = RV.ids.length; RV.done = 0;
  renderReview();
}
function renderReview() {
  const t = S.tx.find(x => x.id === RV.ids[RV.i]);
  if (!t) return finishReview();
  RV.cat = RV.cat && RV.curId === t.id ? RV.cat : t.cat;
  RV.curId = t.id;
  const s = SRC[t.account];
  const owner = t.selfGuess;
  openSheet(`
    <div class="sheet-head"><h3>Cek sekilas</h3><span class="badge badge-muted num">${RV.done + 1} dari ${RV.total}</span></div>
    <div class="rv-progress">${Array.from({ length: RV.total }, (_, i) => `<span class="${i < RV.done ? 'done' : i === RV.done ? 'on' : ''}"></span>`).join('')}</div>
    <div class="rv-source">${srcTile(t.account, true)}<div style="min-width:0;flex:1"><b>Email dari ${esc(s.name)}</b> · ${dayLabel(t.ts)}, ${timeLabel(t.ts)}<code>"${esc(t.raw)}"</code></div></div>
    <div class="rv-amount">
      <div class="v num">${rupiah(t.amount)}</div>
      <div class="m">${esc(t.merchant)}</div>
      <div class="conf"><span class="hint">Keyakinan</span><span class="conf-bar"><i style="width:${Math.round(t.conf * 100)}%"></i></span><span class="hint num">${Math.round(t.conf * 100)}%</span></div>
    </div>
    ${owner ? `<div class="note" style="margin-bottom:14px">${ic('swap')}<div>Nama penerima mirip namamu. <b>Apakah ini pindah uang ke rekeningmu sendiri?</b></div></div>
      <div class="rv-actions"><button class="btn btn-soft" onclick="rvAnswer('expense')">Bukan, ini bayar</button><button class="btn btn-primary" onclick="rvAnswer('self')">Ya, rekening sendiri</button></div>`
    : `<div class="rv-q">Kategorinya sudah tepat?</div>
      <div class="cat-pick">${CATS.filter(c => !['transfer', 'fee'].includes(c.id)).map(c => `<button class="cat-opt ${RV.cat === c.id ? 'on' : ''}" onclick="RV.cat='${c.id}';renderReviewKeep()">${catTile(c.id, true)}<span>${c.name}</span></button>`).join('')}</div>
      <div class="rv-actions"><button class="btn btn-soft" onclick="rvAnswer('skip')">Nanti saja</button><button class="btn btn-primary" onclick="rvAnswer('ok')">${ic('check', 'ic-sm')} Simpan</button></div>`}
    <div class="rv-alt"><button class="btn btn-ghost btn-sm" onclick="rvAnswer('notx')">${ic('x', 'ic-sm')} Bukan transaksi</button></div>`);
}
function renderReviewKeep() {
  // ganti isi tanpa animasi ulang
  const root = document.getElementById('sheet-root');
  const scroll = root.querySelector('.sheet')?.scrollTop || 0;
  root.querySelectorAll('.cat-opt').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes(`'${RV.cat}'`)));
  root.querySelector('.sheet').scrollTop = scroll;
}
function rvAnswer(a) {
  const t = S.tx.find(x => x.id === RV.curId);
  if (!t) return;
  if (a === 'ok') { t.cat = RV.cat; t.status = 'ok'; t.conf = 1; S.rules[t.merchant] = RV.cat; toast(`Tersimpan · ${CAT[RV.cat].name}`); }
  if (a === 'self') { t.type = 'transfer'; t.cat = 'transfer'; t.status = 'ok'; t.to = 'self'; toast('Dicatat sebagai transfer ke rekening sendiri'); }
  if (a === 'expense') { t.selfGuess = false; t.cat = 'other'; save(); RV.cat = 'other'; renderReviewSwap(); return; }
  if (a === 'notx') {
    const i = S.tx.findIndex(x => x.id === t.id);
    _lastDeleted = { t: S.tx[i], i }; S.tx.splice(i, 1);
    toast('Dihapus dari catatan', 'undo');
  }
  if (a === 'skip') {
    if (RV.ids.length <= 1) { closeSheet(); render(); toast('Oke, bisa dicek nanti dari menu Transaksi'); return; }
    RV.ids.push(RV.ids.shift());
  } else { RV.ids.shift(); RV.done++; }
  save();
  if (!RV.ids.length) return finishReview();
  renderReviewSwap();
}
function renderReviewSwap() {
  const sheet = document.querySelector('.sheet');
  if (!sheet) return renderReview();
  sheet.style.transition = 'opacity .15s'; sheet.style.opacity = '.0';
  setTimeout(() => {
    const t = S.tx.find(x => x.id === RV.ids[RV.i]);
    if (!t) return finishReview();
    RV.cat = t.cat; RV.curId = t.id;
    const root = document.getElementById('sheet-root');
    renderReview();
    const s2 = root.querySelector('.sheet');
    if (s2) { s2.style.opacity = '1'; }
  }, 150);
}
function finishReview() {
  openSheet(`<div style="text-align:center;padding:16px 0 4px">
      <div class="sync-orb done" style="margin:0 auto 18px;width:80px;height:80px;border-radius:26px">${ic('check', 'ic-lg')}</div>

}

  document.querySelectorAll('#sheet-root .cat-opt').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes(`'${DT.cat}'`)));
}
function saveDetail() {
  const t = S.tx.find(x => x.id === DT.id);
  const changed = t.cat !== DT.cat;
  t.cat = DT.cat;
  let n = 0;
  if (DT.remember) {
    S.rules[t.merchant] = DT.cat;
    S.tx.forEach(x => { if (x.merchant === t.merchant && x.cat !== DT.cat && x.type === 'expense') { x.cat = DT.cat; n++; } });
  } else delete S.rules[t.merchant];
  save(); closeSheet(); render();
  toast(DT.remember && n ? `Tersimpan · ${n} transaksi ${t.merchant} lain ikut diperbarui` : changed ? 'Kategori diperbarui' : 'Tersimpan');
}
function markSelf() {
  const t = S.tx.find(x => x.id === DT.id);
  t.type = 'transfer'; t.cat = 'transfer'; t.to = 'self';
  save(); closeSheet(); render(); toast('Dipindah ke transfer · tidak dihitung pengeluaran');
}
function markExpense() {
  const t = S.tx.find(x => x.id === DT.id);
  t.type = 'expense'; t.cat = 'other'; t.to = '';
  DT.cat = 'other'; save(); renderDetail();
}
let _lastDeleted = null;
function deleteTx() {
  const i = S.tx.findIndex(x => x.id === DT.id);
  _lastDeleted = { t: S.tx[i], i };
  S.tx.splice(i, 1); save(); closeSheet(); render();
  toast('Transaksi dihapus', 'undo');
}
function undoDelete() {
  if (!_lastDeleted) return;
  S.tx.splice(_lastDeleted.i, 0, _lastDeleted.t); _lastDeleted = null; save(); render(); toast('Dikembalikan');
}

/* ---------- Tambah ---------- */
let ADD = { text: '', parsed: null, form: null };
function openAdd() {
  ADD = { text: '', parsed: null, form: { amount: '', merchant: '', cat: 'food', account: S.ob.sources.includes('cash') ? 'cash' : S.ob.sources[0], type: 'expense' } };
  renderAdd();
  setTimeout(() => document.getElementById('smart-in')?.focus(), 380);
}
function renderAdd() {
  const smart = UI.addMode === 'smart';
  openSheet(`
    <div class="sheet-head"><h3>Catat transaksi</h3><button class="icon-btn" onclick="closeSheet()" aria-label="Tutup">${ic('x')}</button></div>
    <div class="seg" style="margin-bottom:16px"><button class="${smart ? 'on' : ''}" onclick="UI.addMode='smart';renderAdd()">${ic('sparkle', 'ic-sm')} Ketik cepat</button><button class="${!smart ? 'on' : ''}" onclick="UI.addMode='form';renderAdd()">${ic('keyboard', 'ic-sm')} Formulir</button></div>
    ${smart ? `
      <div class="smart"><textarea id="smart-in" placeholder="Tulis seperti chat… mis. kopi susu 18rb pakai gopay" oninput="smartInput(this.value)">${esc(ADD.text)}</textarea></div>
      <div class="parse-chips" id="parse-chips">${parseChips()}</div>
      <div class="examples">${['makan siang nasi padang 35rb tunai', 'bensin 50rb pakai jago', 'beli buku 120rb kemarin', 'parkir 5000 cash'].map(e => `<button onclick="useExample('${e}')">${e}</button>`).join('')}</div>
      <button class="btn btn-primary btn-block" style="margin-top:18px" id="smart-save" onclick="saveSmart()" ${ADD.parsed && ADD.parsed.amount ? '' : 'disabled'}>Simpan</button>
      <p class="hint" style="text-align:center;margin:12px 0 0">Yang dibayar lewat bank & e-wallet terhubung tidak perlu dicatat. Cukup untuk tunai.</p>`
    : formHtml()}`);
}
function formHtml() {
  const f = ADD.form;
  return `<div class="stack">
    <div class="input-wrap"><span class="input-prefix">Rp</span><input id="f-amt" class="input input-money num" inputmode="numeric" placeholder="0" value="${f.amount ? Number(f.amount).toLocaleString('id-ID') : ''}" oninput="const v=Number(this.value.replace(/\\D/g,''))||0;ADD.form.amount=v;this.value=v?v.toLocaleString('id-ID'):''"></div>
    <div class="field"><label class="label" for="f-mer">Untuk apa?</label><input id="f-mer" class="input" placeholder="mis. Bakso Pak Kumis" value="${esc(f.merchant)}" oninput="ADD.form.merchant=this.value"></div>
    <div class="field"><span class="label">Kategori</span>
      <div class="cat-pick">${CATS.filter(c => !['transfer', 'fee'].includes(c.id)).map(c => `<button class="cat-opt ${f.cat === c.id ? 'on' : ''}" onclick="ADD.form.cat='${c.id}';document.querySelectorAll('#sheet-root .cat-opt').forEach(b=>b.classList.toggle('on',b===this))">${catTile(c.id, true)}<span>${c.name}</span></button>`).join('')}</div></div>
    <div class="field"><span class="label">Dibayar dengan</span>
      <div class="chips">${S.ob.sources.map(id => `<button class="chip ${f.account === id ? 'on' : ''}" onclick="ADD.form.account='${id}';this.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===this))">${esc(SRC[id].name)}</button>`).join('')}</div></div>
    <button class="btn btn-primary btn-block" onclick="saveForm()">Simpan</button>
  </div>`;
}
function smartParse(text) {
  const raw = text.trim(); const low = raw.toLowerCase();
  if (!raw) return null;
  let amount = 0;
  const m = low.match(/(?:rp\.?\s*)?(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?\b/);
  if (m) {
    let n = parseFloat(m[1].replace(/\.(?=\d{3}\b)/g, '').replace(',', '.')) || 0;
    if (/rb|ribu|k/.test(m[2] || '')) n *= 1e3;
    if (/jt|juta/.test(m[2] || '')) n *= 1e6;
    amount = Math.round(n);
  }
  const accMap = { cash: ['tunai', 'cash'], gopay: ['gopay'], ovo: ['ovo'], dana: ['dana'], shopeepay: ['shopeepay'], jago: ['jago'], mandiri: ['mandiri', 'livin'], bca: ['bca'], bri: ['bri'], bni: ['bni'], bsi: ['bsi'], seabank: ['seabank'], blu: ['blu'], superbank: ['superbank'] };
  let account = '';
  for (const [id, kws] of Object.entries(accMap)) if (kws.some(k => new RegExp(`\\b${k}\\b`).test(low))) { account = id; break; }
  const when = /kemarin/.test(low) ? -1 : 0;
  let merchant = (m ? raw.slice(0, m.index) + ' ' + raw.slice(m.index + m[0].length) : raw)
    .replace(/\b(pakai|pake|via|dari|dengan|bayar|tunai|cash|kemarin|hari ini)\b/gi, ' ')
    .replace(new RegExp(`\\b(${Object.values(accMap).flat().join('|')})\\b`, 'gi'), ' ')
    .replace(/\s+/g, ' ').trim();
  merchant = merchant ? merchant[0].toUpperCase() + merchant.slice(1) : '';
  const known = S.rules[merchant];
  let cat = known || 'other';
  if (!known) for (const [id, kws] of Object.entries(CAT_KEYWORDS)) if (kws.some(k => new RegExp(`\\b${k}\\b`).test(low))) { cat = id; break; }
  return { amount, account, merchant, cat, when };
}
function parseChips() {
  const p = ADD.parsed;
  if (!p) return `<span class="hint">${BRAND.name} akan mengenali nominal, kategori, dan cara bayar.</span>`;
  const chip = (lbl, val, ok) => `<span class="pchip ${ok ? '' : 'miss'}"><small>${lbl}</small> ${val}</span>`;
  return [
    chip('Nominal', p.amount ? rupiah(p.amount) : 'belum ada', !!p.amount),
    chip('Kategori', `${(CAT[p.cat] || CAT.other).name}`, true),
    chip('Bayar', p.account ? SRC[p.account].name : 'Tunai', true),
    p.when ? chip('Tanggal', 'Kemarin', true) : ''
  ].join('');
}
function smartInput(v) {
  ADD.text = v; ADD.parsed = smartParse(v);
  document.getElementById('parse-chips').innerHTML = parseChips();
  const b = document.getElementById('smart-save');
  if (b) b.disabled = !(ADD.parsed && ADD.parsed.amount);
}
function useExample(e) { const el = document.getElementById('smart-in'); el.value = e; smartInput(e); el.focus(); }
function addManual(o) {
  const ts = Date.now() + (o.when || 0) * 864e5;
  const t = mkTx({ ts, merchant: o.merchant || 'Pengeluaran', cat: o.cat, amount: o.amount, account: o.account || 'cash', manual: true });
  t.source = 'manual';
  S.tx.unshift(t); S.tx.sort((a, b) => b.ts - a.ts); save(); closeSheet(); render();
  toast(`Tercatat · ${rupiah(o.amount)} ${(CAT[o.cat] || CAT.other).name}`);
}
function saveSmart() { const p = ADD.parsed; if (!p || !p.amount) return; addManual(p); }
function saveForm() {
  const f = ADD.form;
  if (!f.amount) { toast('Isi nominalnya dulu'); return; }
  addManual({ amount: f.amount, merchant: f.merchant.trim() || CAT[f.cat].name, cat: f.cat, account: f.account });
}

/* =========================================================
   TOAST
   ========================================================= */
function toast(msg, action) {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${ic('check', 'ic-sm')}<span>${esc(msg)}</span>${action === 'undo' ? '<button onclick="undoDelete();this.parentNode.remove()">Urungkan</button>' : ''}`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; setTimeout(() => el.remove(), 300); }, action ? 4200 : 2600);
}

/* =========================================================
   INIT
   ========================================================= */
S = load() || defaults();
if (S.tx && S.tx.length) _id = S.tx.length + 10;
if (S.pin && !['login', 'onboarding', 'sync'].includes(S.route)) S.locked = true;
if (S.route === 'sync') S.route = S.tx.length ? 'home' : 'onboarding';
applyTheme();
render();
</script>
</body>
</html>
