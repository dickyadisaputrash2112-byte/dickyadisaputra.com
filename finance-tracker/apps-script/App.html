   catat.id — aplikasi web (satu halaman)
   Semua data lewat google.script.run.api(aksi, data)

var S = {
  boot: null, route: 'boot', params: {}, stack: [], data: {}, loading: {},
  intro: 0, ob: null, pin: '', pinFirst: '', pinMode: '', syncState: null,
  review: null, det: null, add: null, txFilter: 'all', txQ: '', txSearch: false,
  month: null, ae: null, gf: null, akun: null, srcEdit: null, dep: null, busy: false
};

/* ---------------- API ---------------- */
function api(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) resolve(r.data);
        else reject(new Error((r && r.error) || 'Terjadi kesalahan.'));
      })
      .withFailureHandler(function (e) { reject(new Error((e && e.message) || String(e))); })
      .api(action, payload || {});
  });
}

function need(key, action, payload) {
  if (S.data[key] !== undefined) return S.data[key];
  if (!S.loading[key]) {
    S.loading[key] = true;
    api(action, payload).then(function (d) { S.data[key] = d; })
      .catch(function (e) { S.data[key] = { __error: e.message }; })
      .then(function () { delete S.loading[key]; render(); });
  }
  return undefined;
}

function invalidate() {
  var prefixes = Array.prototype.slice.call(arguments);
  Object.keys(S.data).forEach(function (k) {
    if (!prefixes.length || prefixes.some(function (p) { return k.indexOf(p) === 0; })) delete S.data[k];
  });
}

};
function ic(name, cls) {
  return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="' + (P[name] || P.dots) + '"/></svg>';
}
var CAT_ICON = { food: 'food', coffee: 'coffee', groceries: 'cart', transport: 'car', shopping: 'bag', bills: 'bill', health: 'heart', fun: 'play', edu: 'book', fee: 'percent', transfer: 'swap', salary: 'arrIn', income_other: 'arrIn', other: 'dots' };
function catIcon(key, name) {
  if (CAT_ICON[key]) return CAT_ICON[key];
  var n = String(name || '').toLowerCase();
  if (/makan|food|resto/.test(n)) return 'food';
  if (/kopi|coffee|jajan|snack/.test(n)) return 'coffee';
  if (/transport/.test(n)) return 'car';
  if (/belanja|shop/.test(n)) return 'bag';
  if (/tagihan|bill/.test(n)) return 'bill';
  if (/sehat|health/.test(n)) return 'heart';
  if (/hibur|entertain/.test(n)) return 'play';
  if (/didik|educ/.test(n)) return 'book';
  if (/admin|fee/.test(n)) return 'percent';
  if (/transfer/.test(n)) return 'swap';
  if (/gaji|pemasukan|income/.test(n)) return 'arrIn';
  return 'dots';
}
function catInfo(name) {
  var c = (S.boot.categories || []).filter(function (x) { return x.name === name; })[0];
  return c || { name: name, key: '', color: '#3A4E78', group: 'Want' };
}
function catalogInfo(name) {
  return (S.boot.catalog || []).filter(function (x) { return x.name === name; })[0] || { name: name, abbr: name.slice(0, 2).toUpperCase(), color: '#3A4E78' };
}
function acctInfo(name) {
  var a = (S.boot.accounts || []).filter(function (x) { return x.name === name; })[0]
    || (S.boot.catalog || []).filter(function (x) { return x.name.toLowerCase() === String(name).toLowerCase(); })[0];
  return a || { name: name, abbr: String(name || '?').slice(0, 2).toUpperCase(), color: '#3A4E78', mode: 'manual' };
}

/* ---------------- Format ---------------- */
function esc(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function rp(n) { var v = Math.round(Number(n) || 0); return (v < 0 ? '−Rp' : 'Rp') + Math.abs(v).toLocaleString('id-ID'); }
function short(n) {
  n = Math.round(Number(n) || 0);
  if (Math.abs(n) >= 1e6) return 'Rp' + (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' jt';
  if (Math.abs(n) >= 1e3) return 'Rp' + Math.round(n / 1e3) + 'rb';
  return 'Rp' + n;
}
var MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
var DAYS = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
function sod(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function dayLabel(iso) {
  var d = sod(iso), t = sod(new Date());
  var diff = Math.round((t - d) / 864e5);
  if (diff === 0) return 'Hari ini';
  if (diff === 1) return 'Kemarin';
  return DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
}
function timeLabel(iso) { var d = new Date(iso); return ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2); }
function shortDate(iso) { var d = new Date(iso); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3); }
function ago(iso) {
  if (!iso) return 'belum pernah';
  var m = Math.max(1, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return m + ' mnt lalu';
  var h = Math.round(m / 60);
  return h < 24 ? h + ' jam lalu' : Math.round(h / 24) + ' hari lalu';
}
function ym(d) { d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function ymLabel(v) { var p = v.split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }
function shiftMonth(v, n) { var p = v.split('-'); return ym(new Date(Number(p[0]), Number(p[1]) - 1 + n, 1)); }
function greet() { var h = new Date().getHours(); return h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam'; }
function digits(v) { return Number(String(v || '').replace(/\D/g, '')) || 0; }
function nick() { return (S.boot && S.boot.nickname) || 'Kamu'; }

/* ---------------- Toast ---------------- */
function toast(msg) {
  var w = document.getElementById('toast');
  w.innerHTML = '<div class="toast">' + ic('check', 'ic-s') + '<span>' + esc(msg) + '</span></div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { w.innerHTML = ''; }, 3000);
}
function fail(e) { S.busy = false; toast((e && e.message) || 'Terjadi kesalahan.'); render(); }

/* ---------------- Router ---------------- */
var TABS = ['home', 'tx', 'insight', 'me'];
function go(route, params, replace) {
  if (TABS.indexOf(route) > -1) S.stack = [];
  else if (!replace) S.stack.push({ route: S.route, params: S.params });
  S.route = route; S.params = params || {};
  window.scrollTo(0, 0);
  render();
}
function back() {
  var p = S.stack.pop();
  if (p) { S.route = p.route; S.params = p.params; } else S.route = 'home';
  window.scrollTo(0, 0);
  render();
}
function render() {
  var v = VIEWS[S.route] || VIEWS.home;
  var html;
  try { html = v(); } catch (e) { html = errorView(e); }
  document.getElementById('app').innerHTML = html;
  if (S.focus) {
    var el = document.getElementById(S.focus.id);
    if (el) { el.focus(); try { el.setSelectionRange(S.focus.pos, S.focus.pos); } catch (e2) {} }
    S.focus = null;
  }
}
function errorView(e) {
  return '<div class="frame app-bg"><div class="page no-nav"><div class="err">' + esc(e.message || e) + '</div><button class="btn btn-dark" data-act="home">Kembali ke Beranda</button></div></div>';
}

/* ---------------- Komponen ---------------- */
function frame(content, opts) {
  opts = opts || {};
  return '<div class="frame app-bg"><div class="page' + (opts.nav ? '' : ' no-nav') + (opts.wide ? ' wide' : '') + '">' + content + '</div>' +
    (opts.nav ? navBar(opts.nav) + '<button class="fab" data-act="quickOpen" aria-label="Catat cepat">' + ic('plus') + 'Catat</button>' : '') +
    (S.quick ? quickSheet() : '') + '</div>';
}
function darkFrame(content) { return '<div class="frame dark-bg"><div class="dark-page">' + content + '</div></div>'; }
function header(title, left, right) {
  var l = left === 'none' ? '<span class="spacer"></span>' : left || '<button class="cbtn" data-act="back" aria-label="Kembali">' + ic('back') + '</button>';
  return '<header class="hdr">' + l + '<h1>' + esc(title) + '</h1>' + (right || '<span class="spacer"></span>') + '</header>';
}
function navBar(active) {
  var items = [['home', 'Beranda', 'home'], ['tx', 'Transaksi', 'list'], ['insight', 'Insight', 'chart'], ['me', 'Profil', 'user']];
  return '<nav class="nav" aria-label="Navigasi utama">' + items.map(function (it) {
    if (it[0] === active) return '<button class="on" data-act="go" data-r="' + it[0] + '" aria-current="page">' + ic(it[2]) + it[1] + '</button>';
    return '<button class="off" data-act="go" data-r="' + it[0] + '" aria-label="' + it[1] + '">' + ic(it[2]) + '<span class="lbl">' + it[1] + '</span></button>';
  }).join('') + '</nav>';
}
function loading(text) { return '<div class="loading"><span class="spin"></span>' + esc(text || 'Memuat…') + '</div>'; }
function errBox(d) { return '<div class="err">' + esc(d.__error) + '</div>'; }
// Logo asli bank/e-wallet diambil dari ikon situs resminya (lewat layanan favicon Google)
// saat aplikasi dibuka. Kalau gagal dimuat, otomatis kembali ke lingkaran berwarna + singkatan.
var LOGO_SITE = {
  mandiri: 'bankmandiri.co.id', jago: 'jago.com', bsi: 'bankbsi.co.id', superbank: 'superbank.id',
  bca: 'bca.co.id', bri: 'bri.co.id', bni: 'bni.co.id', seabank: 'seabank.co.id', blu: 'blubybcadigital.id',
  'cimb niaga': 'cimbniaga.co.id', permata: 'permatabank.com', gopay: 'gopay.co.id', ovo: 'ovo.id',
  dana: 'dana.id', shopeepay: 'shopeepay.co.id'
};
function badge(a, size, style) {
  var site = LOGO_SITE[String(a.name || '').toLowerCase()];
  var fs = Math.max(9, Math.round(size * 0.28));
  return '<span class="blogo' + (site ? '' : ' nofav') + '" style="width:' + size + 'px;height:' + size + 'px;--c:' + esc(a.color) + ';' + (style || '') + '">' +
    (site ? '<img src="https://www.google.com/s2/favicons?domain=' + site + '&sz=128" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'nofav\')">' : '') +
    '<b style="font-size:' + fs + 'px">' + esc(a.abbr) + '</b></span>';
}
function logo(name, size) { return badge(acctInfo(name), size || 40); }
function ring(pct, color, size, inner, icon, iconColor) {
  var deg = Math.round(Math.max(0, Math.min(100, pct)) * 3.6);
  return '<span class="ring" style="width:' + size + 'px;height:' + size + 'px;background:conic-gradient(' + color + ' 0 ' + deg + 'deg, rgba(255,255,255,0.65) 0)"><span style="width:' + inner + 'px;height:' + inner + 'px;color:' + (iconColor || color) + '">' + ic(icon) + '</span></span>';
}
function txRow(t) {
  var isIn = t.type === 'Income', isTr = t.type === 'Transfer', review = t.status === 'review';
  var c = catInfo(t.category);
  var icon = review ? 'spark' : isTr ? 'swap' : isIn ? 'arrIn' : catIcon(c.key, t.category);
  var color = review ? '#fff' : isTr ? '#3A4E78' : isIn ? '#17643F' : c.color;
  var meta = isTr ? esc(t.account) + ' → ' + esc(t.toAccount) : esc(t.account) + (t.category ? ' · ' + esc(t.category) : '');
  var amt = isTr ? rp(t.amount) : (isIn ? '+' : '−') + rp(t.amount);
  return '<button class="trow" data-act="' + (review ? 'review' : 'detail') + '" data-id="' + esc(t.id) + '">' +
    '<span class="ticon" style="background:' + (review ? '#F08A3C' : '#fff') + ';color:' + color + '">' + ic(icon) + '</span>' +
    '<span class="tmain"><span class="ttitle">' + esc(t.description || t.merchant || 'Transaksi') + '</span>' +
    '<span class="tmeta">' + (review ? '<span class="pill orange" style="height:20px;font-size:10px">Perlu dicek</span>' : '') + (t.source === 'manual' ? ic('edit', 'ic-s') : '') + meta + '</span></span>' +
    '<span class="tamt"><b class="' + (isIn ? 'amt-in' : isTr ? 'amt-tr' : '') + '">' + amt + '</b><small>' + timeLabel(t.date) + '</small></span></button>';
}
function catChips(list, selected, act) {
  return '<div class="chips">' + list.map(function (c) {
    var on = c.name === selected;
    return '<button class="chip ic-chip' + (on ? ' on' : '') + '" data-act="' + act + '" data-v="' + esc(c.name) + '" aria-pressed="' + on + '">' +
      '<span class="cic" style="color:' + esc(c.color) + '">' + ic(catIcon(c.key, c.name), 'ic-s') + '</span>' + esc(c.name) + '</button>';
  }).join('') + '</div>';
}
function expenseCats() { return S.boot.categories.filter(function (c) { return c.group !== 'Income' && c.group !== 'Transfer'; }); }
function incomeCats() { return S.boot.categories.filter(function (c) { return c.group === 'Income'; }); }
function switchHtml(id, on, act, label) {
  return '<label class="switch"><span class="sr">' + esc(label) + '</span><input type="checkbox" id="' + id + '" data-change="' + act + '"' + (on ? ' checked' : '') + '><i></i></label>';
}

/* ================================================================
   INTRO & ONBOARDING
   ================================================================ */
var VIEWS = {};

/* ---------------- Tema warna ---------------- */
var THEMES = [['biru', 'Biru', '#2E55B0', '#0E1F4D'], ['hijau', 'Hijau', '#2C8A63', '#0F3B2E'], ['ungu', 'Ungu', '#6A45C9', '#2A1458'], ['terakota', 'Terakota', '#B5532E', '#4A1E12'], ['grafit', 'Grafit', '#4A5263', '#1C1F26']];
function applyTheme(t) {
  t = THEMES.some(function (x) { return x[0] === t; }) ? t : 'biru';
  if (t === 'biru') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('catat_theme', t); } catch (e) {}
  var meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', THEMES.filter(function (x) { return x[0] === t; })[0][3]);
}

/* ---------------- Catat cepat (lembar dari bawah) ---------------- */
function quickSheet() {
  var A = S.add, p = A.parsed;
  var accts = S.boot.accounts.filter(function (a) { return a.active; });
  return '<div class="sheet-wrap" data-act="quickClose" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Catat cepat">' +
    '<span class="grab"></span>' +
    '<div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:19px;letter-spacing:-.03em">Catat cepat</b><button class="cbtn" data-act="quickClose" aria-label="Tutup">' + ic('x') + '</button></div>' +
    '<section class="glass pad"><label for="add-text" class="small" style="font-weight:700;color:var(--ink-2)">Tulis seperti chat</label>' +
    '<textarea id="add-text" class="big-input" rows="2" data-input="addText" placeholder="nasi goreng 25rb tunai">' + esc(A.text) + '</textarea>' +
    '<div class="grid2" id="add-parsed" style="margin-top:14px">' + parsedChips(p) + '</div></section>' +
    '<div class="chips">' + accts.map(function (a) { return '<button class="chip' + (A.account === a.name ? ' on' : '') + '" data-act="addAcct" data-v="' + esc(a.name) + '">' + esc(a.name) + '</button>'; }).join('') + '</div>' +
    '<div class="row-btns"><button class="btn btn-glass" data-act="quickFull">Formulir lengkap</button><button class="btn btn-dark grow" id="add-save" data-act="addSave"' + (p && p.amount > 0 && !S.busy ? '' : ' disabled') + '>' + (S.busy ? 'Menyimpan…' : 'Simpan') + '</button></div>' +
    '</div></div>';
}

VIEWS.intro = function () {
  var i = S.intro;
  var top = '<div class="top-progress"><span class="count">0' + (i + 1) + ' / 03</span><div class="segs">' +
    [0, 1, 2].map(function (k) { return '<span class="' + (k <= i ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
    (i < 2 ? '<button class="skip" data-act="introSkip">Lewati</button>' : '') + '</div>';
  var slides = [
    ['Catat uangmu', 'tanpa mencatat.', 'Notifikasi bank & e-wallet di Gmail-mu otomatis jadi catatan yang rapi.'],
    ['Semua bank,', 'satu catatan.', 'Mandiri, BCA, Jago, GoPay, dan lainnya terbaca otomatis, termasuk gaji yang masuk.'],
    ['Data tetap', 'milikmu.', 'Semua catatan tersimpan di Google Sheets di Drive-mu sendiri, terkunci dengan PIN.']
  ];
  var s = slides[i];
  var cta = i < 2
    ? '<button class="btn btn-cta" data-act="introNext">Lanjut' + ic('right') + '</button>'
    : '<button class="btn btn-cta" data-act="introDone">Mulai sebagai ' + esc(S.boot.email || 'akun Google ini') + '</button>' +
      '<p class="center" style="margin:14px 0 0;font-size:12px;color:var(--dark-text-3)">Hanya membaca email transaksi. Tidak pernah mengirim email atas namamu.</p>';
  return darkFrame(top +

function setUnlocked() { try { sessionStorage.setItem('jejak_unlocked', '1'); } catch (e) {} }

function pinKey(v, scope) {
  if (S.busy) return;
  if (v === 'del') S.pin = S.pin.slice(0, -1);
  else if (S.pin.length < 6) S.pin += v;
  render();
  if (S.pin.length < 6) return;
  var pin = S.pin;
  setTimeout(function () {
    if (scope === 'lock') {
      S.busy = true; render();
      api('verifyPin', { pin: pin }).then(function (r) {
        S.busy = false; S.pin = '';
        if (r.ok) { setUnlocked(); go('home'); } else { render(); shake(); }
      }).catch(fail);
      return;
    }
    if (!S.pinFirst) { S.pinFirst = pin; S.pin = ''; render(); return; }
    if (S.pinFirst !== pin) { S.pinFirst = ''; S.pin = ''; render(); shake(); toast('PIN tidak sama, ulangi.'); return; }
    if (scope === 'ob') { S.ob.pin = pin; S.pinFirst = ''; finishOnboarding(); return; }
    S.busy = true; render();
    api('setPin', { pin: pin }).then(function () {
      S.busy = false; S.pin = ''; S.pinFirst = ''; S.boot.hasPin = true; setUnlocked(); toast('PIN aktif'); back();
    }).catch(fail);
  }, 120);
}
function shake() { var d = document.getElementById('pin-dots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); } }

/* ---------------- Catat manual ---------------- */
function addInit() {
  var accts = S.boot.accounts.filter(function (a) { return a.active; });
  var cash = accts.filter(function (a) { return a.mode === 'manual'; })[0] || accts[0] || { name: 'Tunai' };
  S.add = { mode: 'smart', text: '', type: 'Expense', amount: 0, desc: '', account: cash.name, category: '', when: 0, parsed: null };
}
function smartParse(text) {
  var raw = String(text || '').trim(), low = raw.toLowerCase();
  if (!raw) return null;
  var amount = 0, m = low.match(/(?:rp\.?\s*)?(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![a-z])/);
  if (m) {
    var n = parseFloat(m[1].replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')) || 0;
    if (/^(rb|ribu|k)$/.test(m[2] || '')) n *= 1e3;
    if (/^(jt|juta)$/.test(m[2] || '')) n *= 1e6;
    amount = Math.round(n);
  }
  var account = '';
  S.boot.accounts.concat(S.boot.catalog).some(function (a) {
    var re = new RegExp('(^|[^a-z])' + a.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z]|$)');
    if (re.test(low)) { account = a.name; return true; }
    return false;
  });
  if (!account && /(tunai|cash)/.test(low)) account = (S.boot.accounts.filter(function (a) { return a.mode === 'manual'; })[0] || { name: 'Tunai' }).name;
  var isIn = /(gaji|dapat|terima|masuk|bonus|thr|dibayar)/.test(low);
  var when = /kemarin/.test(low) ? -1 : 0;
  var desc = m ? raw.slice(0, m.index) + ' ' + raw.slice(m.index + m[0].length) : raw;
  desc = desc.replace(/\b(pakai|pake|via|dari|dengan|bayar|tunai|cash|kemarin|hari ini)\b/gi, ' ');
  if (account) desc = desc.replace(new RegExp(account.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), ' ');
  desc = desc.replace(/\s+/g, ' ').trim();
  desc = desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : '';
  var category = '';
  var pool = isIn ? incomeCats() : expenseCats();
  pool.some(function (c) {
    return (c.keywords || []).some(function (k) {
      var re = new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)');
      if (re.test(low)) { category = c.name; return true; }
      return false;
    });
  });
  return { amount: amount, account: account, desc: desc, type: isIn ? 'Income' : 'Expense', category: category, when: when };
}
VIEWS.add = function () {
  if (!S.add) addInit();
  var A = S.add, smart = A.mode === 'smart';
  var seg = '<div class="seg"><button class="' + (smart ? 'on' : '') + '" data-act="addMode" data-v="smart">Ketik cepat</button><button class="' + (!smart ? 'on' : '') + '" data-act="addMode" data-v="form">Formulir</button></div>';
  var body;

VIEWS.alloc = function () {

  var cur = editing ? S.ae : d.pct;
  var seg = '<div class="seg">' + tpls.map(function (t) {
    var on = cur.need === t[0] && cur.want === t[1] && cur.save === t[2];

  var colors = { need: '#7FA7FF', want: '#F08A3C', save: '#8FD9AE' };
  var hero = '<section class="navy-card pad"><div style="display:flex;justify-content:space-between;align-items:center"><span class="small" style="color:var(--dark-text-3)">' + (d.usingExpected ? 'Perkiraan pemasukan' : 'Pemasukan ' + ymLabel(m)) + '</span><span class="pill" style="background:var(--ice);color:var(--navy)">' + (d.pct.need + d.pct.want + d.pct.save) + '% teralokasi</span></div>' +
    '<div style="margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-.05em">' + rp(d.base) + '</div>' +
    '<div style="display:flex;gap:4px;height:18px;margin-top:16px" aria-hidden="true"><span style="flex:' + d.pct.need + ';border-radius:99px 4px 4px 99px;background:' + colors.need + '"></span><span style="flex:' + d.pct.want + ';border-radius:4px;background:' + colors.want + '"></span><span style="flex:' + d.pct.save + ';border-radius:4px 99px 99px 4px;background:' + colors.save + '"></span></div>' +
    '<div class="grid3" style="margin-top:14px">' + d.groups.map(function (g) {
      return '<div><div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--dark-text-3)"><span style="width:8px;height:8px;border-radius:99px;background:' + colors[g.key] + '"></span>' + g.name.split(' ')[0] + ' ' + d.pct[g.key] + '%</div><b style="font-size:15px">' + short(g.amount) + '</b></div>';
    }).join('') + '</div>' +
    (d.base ? '' : '<p class="small" style="margin:12px 0 0;color:var(--ice)">Isi perkiraan pemasukan (ikon pensil) supaya jatah bisa dihitung.</p>') + '</section>';
  var editBox = editing ? '<section class="glass pad" style="display:flex;flex-direction:column;gap:10px"><div class="field"><label for="ae-income">Perkiraan pemasukan per bulan</label><input id="ae-income" class="inp" inputmode="numeric" data-input="aeIncome" value="' + (S.ae.income ? S.ae.income.toLocaleString('id-ID') : '') + '"></div>' +
    '<div class="grid3">' + [['need', 'Kebutuhan'], ['want', 'Keinginan'], ['save', 'Tabungan']].map(function (k) { return '<div class="field"><label for="ae-' + k[0] + '">' + k[1] + ' %</label><input id="ae-' + k[0] + '" class="inp" inputmode="numeric" data-input="aePct" data-k="' + k[0] + '" value="' + S.ae[k[0]] + '"></div>'; }).join('') + '</div>' +
    '<span class="small muted" id="ae-sum">Total ' + (S.ae.need + S.ae.want + S.ae.save) + '% (harus 100%)</span></section>' : '';
  var groups = d.groups.map(function (g) {
    var items = g.items.map(function (it, i) {
      var isSave = g.key === 'save';
      var warn = !isSave && it.budget > 0 && it.pct >= 85;
      var over = !isSave && it.budget > 0 && it.pct > 100;
      var right = isSave ? (it.pct >= 100 ? '<span class="small" style="font-weight:700;color:var(--green)">✓ Terkirim</span>' : '<span class="small" style="font-weight:700;color:#8A3F0A">Belum dikirim</span>')
        : over ? '<span class="small" style="font-weight:700;color:var(--red)">Lewat ' + short(it.used - it.budget) + '</span>'
        : warn ? '<span class="small" style="font-weight:700;color:#8A3F0A">Hampir habis</span>' : '<span class="small" style="font-weight:700;color:var(--ink-2)">' + (it.budget ? 'Sisa ' + short(Math.max(0, it.budget - it.used)) : 'Tanpa jatah') + '</span>';
      var budgetCtl = editing && !isSave ? '<input class="inp" inputmode="numeric" data-input="aeBudget" data-name="' + esc(it.name) + '" value="' + ((S.ae.budgets[it.name] !== undefined ? S.ae.budgets[it.name] : it.budget) || '').toLocaleString('id-ID') + '" aria-label="Jatah ' + esc(it.name) + '" style="height:38px;margin-top:6px;font-size:13px">' : '';
      return '<div class="trow" style="align-items:flex-start' + (i ? '' : ';border-top:0') + '"><span class="ticon" style="width:40px;height:40px;color:' + esc(it.color || 'var(--navy-2)') + '">' + ic(isSave ? (it.icon || 'target') : catIcon(it.key, it.name), 'ic-s') + '</span><span class="tmain"><span style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px">' + esc(it.name) + '</b>' + right + '</span>' +
        '<span class="bar thin" style="display:block;margin-top:6px"><i style="width:' + Math.min(100, it.pct) + '%;background:' + (isSave ? 'var(--green)' : warn ? 'var(--orange)' : '#2E55B0') + '"></i></span>' +
        '<span class="small" style="display:block;margin-top:4px;font-weight:600;color:var(--ink-3)">' + short(it.used) + (it.budget ? ' dari ' + short(it.budget) + ' · ' + it.pct + '%' : '') + (isSave ? ' ditabung' : '') + '</span>' + budgetCtl + '</span></div>';
    }).join('');
    return '<section class="glass" style="padding:16px 16px 8px;border-radius:30px"><div style="display:flex;align-items:center;gap:10px"><span style="width:12px;height:12px;border-radius:99px;background:' + colors[g.key] + '"></span><b style="flex:1;font-size:16px">' + g.name + '</b><span class="small" style="font-weight:700;color:var(--ink-2)">' + short(g.used) + ' <span class="muted">/ ' + short(g.amount) + '</span></span></div>' +
      (items || '<div class="empty small">' + (g.key === 'save' ? 'Belum ada goal. Buat di menu Goals.' : 'Belum ada pengeluaran di kelompok ini.') + '</div>') + '</section>';
  }).join('');
  return frame(hdr + seg + hero + editBox + groups);
};

var ACT = {
  back: back,
  home: function () { go('home'); },
  go: function (ds) {
    if (ds.r === 'add') S.add = null;
    if (ds.r === 'tx') { /* tetap filter terakhir */ }
    go(ds.r);
  },
  quickOpen: function () {
    addInit(); S.quick = true; render();
    var el = document.getElementById('add-text'); if (el) el.focus();
  },
  quickClose: function (ds, el, e) {
    if (ds.self && e && e.target !== el) return;
    S.quick = false; S.add = null; render();
  },
  quickFull: function () { S.quick = false; S.add.mode = 'form'; if (S.add.parsed) { S.add.amount = S.add.parsed.amount; S.add.desc = S.add.parsed.desc; S.add.type = S.add.parsed.type; S.add.category = S.add.parsed.category; } go('add'); },
  setTheme: function (ds) {
    applyTheme(ds.v); S.boot.settings.theme = ds.v; render();
    api('saveSettings', { theme: ds.v }).then(function () { toast('Tema diganti'); }).catch(fail);
  },
  introNext: function () { S.intro = Math.min(2, S.intro + 1); render(); },
  introSkip: function () { S.intro = 2; render(); },
  introDone: function () { obInit(); go('ob', {}, true); },
  obBack: function () {
    if (S.ob.step === 0) { S.intro = 2; go('intro', {}, true); return; }
    S.ob.step--; S.pin = ''; S.pinFirst = ''; render();
  },
  obNext: function () {
    var o = S.ob;
    if (o.step === 0) {
      var pending = (document.getElementById('ob-owner') || {}).value;
      if (pending && pending.trim()) o.owners.push(pending.trim());
      if (!o.nickname.trim()) { toast('Isi nama panggilan dulu.'); return; }
      if (!o.owners.length) { toast('Tambahkan minimal satu nama di rekening.'); return; }
    }
    if (o.step === 2 && !(o.income > 0)) { toast('Isi perkiraan pemasukan, atau tulis 0 kalau belum tahu.'); if (o.income !== 0) return; }
    o.step++; window.scrollTo(0, 0); render();
  },
  obTpl: function (ds) { var t = ds.v.split('/').map(Number); S.ob.alloc = { need: t[0], want: t[1], save: t[2] }; render(); },
  obSkipPin: function () { S.ob.pin = ''; S.pin = ''; S.pinFirst = ''; finishOnboarding(); },
  ownerDel: function (ds) { var list = ds.scope === 'ob' ? S.ob.owners : S.akun.owners; list.splice(Number(ds.i), 1); render(); },
  srcToggle: function (ds) {
    var list = ds.scope === 'ob' ? S.ob.sources : S.srcEdit;
    var i = list.indexOf(ds.v);
    if (i > -1) list.splice(i, 1); else list.push(ds.v);
    var y = window.scrollY; render(); window.scrollTo(0, y);
  },

    S.srcEdit = S.boot.accounts.filter(function (a) { return a.active; }).map(function (a) { return a.name; });
    go('sources');
  },
  srcSave: function () {
    S.busy = true; render();
    api('saveSources', { sources: S.srcEdit }).then(function () { return api('bootstrap'); }).then(function (b) {
      S.boot = b; S.busy = false; invalidate('sources'); toast('Sumber transaksi diperbarui'); back();
    }).catch(fail);
  },
  pinKey: function (ds) { pinKey(ds.v, ds.scope); },
  syncNow: syncNow,

  gfIcon: function (ds) { S.gf.icon = ds.v; render(); },
  gfColor: function (ds) { S.gf.color = ds.v; render(); },
  gfSave: function () {
    var F = S.gf;
    if (!F.name.trim() || !(F.target > 0)) { toast('Isi nama dan target goal.'); return; }
    var deadline = F.deadline ? new Date(Number(F.deadline.split('-')[0]), Number(F.deadline.split('-')[1]), 0).toISOString() : '';
    S.busy = true; render();
    api('saveGoal', { id: F.id, name: F.name, target: F.target, current: F.current, deadline: deadline, linkedAccount: F.linkedAccount, icon: F.icon, color: F.color }).then(function () {
      S.busy = false; invalidate('goal', 'alloc', 'home'); toast('Goal tersimpan'); back();
    }).catch(fail);
  },
  goalDelete: function () {
    if (!confirm('Arsipkan goal ini?')) return;
    api('deleteGoal', { id: S.params.id }).then(function () { invalidate('goal', 'alloc'); toast('Goal diarsipkan'); back(); }).catch(fail);
  },
  depOpen: function () { S.dep.open = !S.dep.open; render(); var el = document.getElementById('dep-amt'); if (el) el.focus(); },
  depSave: function () {
    if (!S.dep.amount) { toast('Isi nominal setoran.'); return; }
    S.busy = true; render();
    api('addDeposit', { goalId: S.dep.id, amount: S.dep.amount, note: S.dep.note }).then(function () {
      S.busy = false; S.dep = null; invalidate('goal', 'alloc', 'home'); toast('Setoran tercatat'); render();
    }).catch(fail);
  },
  aeOpen: function () {
    var d = S.data['alloc:' + ym()];
    S.ae = { need: d.pct.need, want: d.pct.want, save: d.pct.save, income: S.boot.settings.expectedIncome || d.base, budgets: {} };
    render();
  },
  allocTpl: function (ds) {
    var t = ds.v.split('/').map(Number);
    if (S.ae) { S.ae.need = t[0]; S.ae.want = t[1]; S.ae.save = t[2]; render(); return; }
    api('saveAllocation', { need: t[0], want: t[1], save: t[2] }).then(function () {
      S.boot.settings.allocNeed = t[0]; S.boot.settings.allocWant = t[1]; S.boot.settings.allocSave = t[2];
      invalidate('alloc', 'home'); toast('Pola alokasi diganti'); render();
    }).catch(fail);
  },
  aeSave: function () {
    var A = S.ae;
    if (A.need + A.want + A.save !== 100) { toast('Persentase harus berjumlah 100%.'); return; }
    S.busy = true;
    api('saveAllocation', { need: A.need, want: A.want, save: A.save, expectedIncome: A.income, budgets: A.budgets }).then(function () {
      S.busy = false; S.boot.settings.allocNeed = A.need; S.boot.settings.allocWant = A.want; S.boot.settings.allocSave = A.save; S.boot.settings.expectedIncome = A.income;
      S.ae = null; invalidate('alloc', 'home'); toast('Alokasi tersimpan'); render();
    }).catch(fail);
  }
};

// Input teks: ubah state tanpa render ulang penuh (supaya kursor tidak hilang)
var INPUT = {
  obNick: function (el) { S.ob.nickname = el.value; },
  obIncome: function (el) { var v = digits(el.value); S.ob.income = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  txQ: function (el) {
    clearTimeout(INPUT._t);
    INPUT._t = setTimeout(function () { S.txQ = el.value.trim(); S.focus = { id: 'tx-q', pos: el.selectionStart }; render(); }, 350);
  },
  addText: function (el) {
    S.add.text = el.value; applyParse();
    var box = document.getElementById('add-parsed'); if (box) box.innerHTML = parsedChips(S.add.parsed);
    var btn = document.getElementById('add-save'); if (btn) btn.disabled = !(S.add.parsed && S.add.parsed.amount > 0);
  },
  addAmt: function (el) { var v = digits(el.value); S.add.amount = v; el.value = v ? v.toLocaleString('id-ID') : ''; var btn = document.getElementById('add-save'); if (btn) btn.disabled = !(v > 0); },
  addDesc: function (el) { S.add.desc = el.value; },
  akunNick: function (el) { S.akun.nickname = el.value; },
  gfName: function (el) { S.gf.name = el.value; },
  gfTarget: function (el) { var v = digits(el.value); S.gf.target = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  gfCurrent: function (el) { var v = digits(el.value); S.gf.current = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  gfDeadline: function (el) { S.gf.deadline = el.value; },
  depAmt: function (el) { var neg = /^\s*-/.test(el.value); var v = digits(el.value); S.dep.amount = neg ? -v : v; el.value = v ? (neg ? '-' : '') + v.toLocaleString('id-ID') : (neg ? '-' : ''); },
  depNote: function (el) { S.dep.note = el.value; },
  aeIncome: function (el) { var v = digits(el.value); S.ae.income = v; el.value = v ? v.toLocaleString('id-ID') : ''; },
  aePct: function (el) { S.ae[el.dataset.k] = Math.min(100, digits(el.value)); var s = document.getElementById('ae-sum'); if (s) s.textContent = 'Total ' + (S.ae.need + S.ae.want + S.ae.save) + '% (harus 100%)'; },
  aeBudget: function (el) { var v = digits(el.value); S.ae.budgets[el.dataset.name] = v; el.value = v ? v.toLocaleString('id-ID') : ''; }
};
var CHANGE = {
  obTrack: function (el) { S.ob.trackIncome = el.checked; },
  obWeekly: function (el) { S.ob.weekly = el.checked; },
  detRemember: function (el) { S.det.remember = el.checked; },
  setTrack: function (el) { saveSetting('trackIncome', el.checked); },
  setWeekly: function (el) { saveSetting('weeklyReviewEnabled', el.checked); },
  setPin: function (el) {
    if (el.checked) { S.pin = ''; S.pinFirst = ''; go('pinSet'); return; }
    api('clearPin', {}).then(function () { S.boot.hasPin = false; toast('PIN dimatikan'); render(); }).catch(fail);
  }
};
function saveSetting(k, v) {
  var p = {}; p[k] = v;
  api('saveSettings', p).then(function () { S.boot.settings[k] = v; invalidate('home'); toast('Pengaturan tersimpan'); }).catch(fail);
}
function applyParse() {
  var p = smartParse(S.add.text);
  if (p && p.account) S.add.account = p.account;
  S.add.parsed = p;
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.input && INPUT[el.dataset.input]) INPUT[el.dataset.input](el);
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.quick) { S.quick = false; S.add = null; render(); return; }
  var el = e.target;
  if (!el.dataset || el.dataset.enter !== 'ownerAdd') return;
  var list = el.dataset.scope === 'ob' ? S.ob.owners : S.akun.owners;
  if ((e.key === 'Enter' || e.key === ',') && el.value.trim()) {
    e.preventDefault();
    if (list.map(function (x) { return x.toLowerCase(); }).indexOf(el.value.trim().toLowerCase()) === -1) list.push(el.value.trim());
    S.focus = { id: el.id, pos: 0 }; render();
  } else if (e.key === 'Backspace' && !el.value && list.length) {
    list.pop(); S.focus = { id: el.id, pos: 0 }; render();
  }
});

VIEWS.sources = function () { return sourcesView('edit'); };

/* ---------------- Mulai ---------------- */
function start() {
  api('bootstrap').then(function (b) {
    S.boot = b;
    applyTheme(b.settings.theme);
    if (!b.onboarded) S.route = 'intro';
    else if (b.hasPin && !isUnlocked()) S.route = 'lock';
    else S.route = 'home';
    render();
  }).catch(function (e) {
    document.getElementById('app').innerHTML = darkFrame('<h1 class="d-title">Ada yang<br><span>belum siap.</span></h1><p class="d-lede">' + esc(e.message) + '</p><p class="d-lede">Buka spreadsheet catat.id, lalu klik menu catat.id → ▶ Mulai / buka aplikasi.</p>');
  });
}
start();
</script>
