name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ruang-source/package-lock.json

      - name: Build Ruang Tumbuh
        run: npm ci --prefix ruang-source && npm run build --prefix ruang-source

      - name: Stage public website
        run: |
          mkdir -p _site
          rsync -a --exclude=".git" --exclude=".github" --exclude="_site" --exclude="ruang-source" --exclude="supabase" --exclude=".gitignore" --exclude="README.md" ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
