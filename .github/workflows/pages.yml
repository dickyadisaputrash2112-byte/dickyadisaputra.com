name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore hero image
        shell: bash
        run: |
          cat assets/dicky-hero.b64.1 assets/dicky-hero.b64.2 assets/dicky-hero.b64.3 assets/dicky-hero.b64.4 assets/dicky-hero.b64.5 | base64 --decode > assets/dicky-hero.webp
          test -s assets/dicky-hero.webp

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
